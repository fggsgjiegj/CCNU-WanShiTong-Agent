<style>
  :root {
    --bg: #0f172a;
    --panel: #0b1120;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-hover: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.10);
    --line-strong: rgba(255, 255, 255, 0.20);
    --t1: #f8fafc;
    --t2: #94a3b8;
    --t3: #64748b;
    --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    --warm: #fb923c; --mint: #34d399; --pink: #f472b6; --lemon: #facc15;
    /* 主题色：整套渐变（按钮 / 标题 / 选中态）都读这两个变量，换色不用改样式表 */
    --acc1: #8b5cf6; --acc2: #06b6d4; --acc1l: #a78bfa; --acc2l: #22d3ee;
  }
  body.theme-blue { --acc1: #2563eb; --acc2: #0891b2; --acc1l: #60a5fa; --acc2l: #22d3ee; }
  body.theme-green { --acc1: #0d9488; --acc2: #65a30d; --acc1l: #2dd4bf; --acc2l: #a3e635; }
  body.light {
    --bg: #eef2f8;
    --panel: #ffffff;
    --glass: rgba(255, 255, 255, 0.80);
    --glass-hover: rgba(255, 255, 255, 0.97);
    --line: rgba(15, 23, 42, 0.09);
    --line-strong: rgba(15, 23, 42, 0.18);
    --t1: #0f172a;
    --t2: #55637a;
    --t3: #7b8798;
    --shadow: 0 10px 30px -14px rgba(15, 23, 42, 0.28);
  }
  * { -webkit-font-smoothing: antialiased; }
  html, body { background: var(--bg); }
  body { color: var(--t1); font-family: Inter, system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(680px 460px at 12% -6%, rgba(139, 92, 246, 0.20), transparent 62%),
      radial-gradient(720px 480px at 96% 2%, rgba(6, 182, 212, 0.16), transparent 60%),
      radial-gradient(560px 420px at 60% 108%, rgba(251, 146, 60, 0.10), transparent 62%);
  }
  body.light::before { opacity: .5; }

  /* ===== 校园微光：地标线稿水印 ===== */
  /* 压在内容之上的极淡线稿纹理：不遮挡阅读，但能透出校园感 */
  .campus-mark { position: fixed; left: 260px; right: 0; bottom: 0; z-index: 35; pointer-events: none; opacity: .07; mix-blend-mode: screen; }
  body.light .campus-mark { opacity: .12; mix-blend-mode: multiply; }
  .campus-mark svg { width: 100%; height: auto; display: block; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, .28); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, .5); }
  .scroll-slim { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .glass-card { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 1rem; transition: all .3s ease; position: relative; }
  .glass-card:hover { transform: translateY(-5px); background: var(--glass-hover); border-color: var(--line-strong); box-shadow: var(--shadow); }
  .btn-press:active { transform: scale(.95); }
  /* 全局点击反馈：点到哪儿，涟漪就在哪儿散开——任何一次点击都有回应 */
  .rip { position: fixed; width: 18px; height: 18px; border-radius: 50%; pointer-events: none; z-index: 300;
         margin: -9px 0 0 -9px; background: radial-gradient(circle, rgba(139,92,246,.55) 0%, rgba(139,92,246,.18) 45%, rgba(139,92,246,0) 72%);
         animation: rip .52s cubic-bezier(.22,.61,.36,1) forwards; }
  @keyframes rip { 0% { transform: scale(.25); opacity: .95; } 100% { transform: scale(3.2); opacity: 0; } }
  .rippleable { position: relative; }
  @media (prefers-reduced-motion: reduce) { .rip { animation-duration: .001s; } }
  .t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); }
  .txt-grad { background-image: linear-gradient(90deg, var(--acc1l) 0%, var(--acc2l) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bg-grad { background-image: linear-gradient(90deg, var(--acc1) 0%, var(--acc2) 100%); }
  .ring-grad { background-image: linear-gradient(135deg, var(--acc1), var(--acc2)); }

  /* ===== 便签与贴纸：打破网格的工业感 ===== */
  .note { transition: transform .3s cubic-bezier(.22,.9,.3,1), box-shadow .3s ease; }
  .note:hover { transform: translateY(-6px) rotate(0deg) !important; }
  .tilt-a { transform: rotate(-.5deg); }
  .tilt-b { transform: rotate(.6deg); }
  .tilt-c { transform: rotate(-.3deg); }
  .glass-card.tilt-a:hover, .glass-card.tilt-b:hover, .glass-card.tilt-c:hover { transform: translateY(-5px) rotate(0deg); }
  .sticker { position: absolute; z-index: 20; padding: 3px 10px; border-radius: 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap; transform: rotate(7deg); box-shadow: 0 8px 18px -8px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.22); }
  .sticker-l { transform: rotate(-8deg); }
  .sticker-warm { background-image: linear-gradient(120deg, #fb923c, #f43f5e); color: #2b0f05; }
  .sticker-mint { background-image: linear-gradient(120deg, #34d399, #22d3ee); color: #04241f; }
  .sticker-pink { background-image: linear-gradient(120deg, #f472b6, #a78bfa); color: #2b0430; }
  .sticker-lemon { background-image: linear-gradient(120deg, #facc15, #fb923c); color: #2b1d02; }

  /* ===== 动效 ===== */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .anim-up { animation: fadeInUp .55s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
  .breath { animation: pulseDot 1.8s ease-in-out infinite; }
  @keyframes breatheGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }
  .glow-dot { animation: breatheGlow 2s infinite; }
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.04) 100%); background-size: 420px 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .rise { animation: riseIn .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .spin { animation: spinSlow 1s linear infinite; }
  @keyframes barGrow { from { width: 0; } }
  .bar-fill { animation: barGrow .9s cubic-bezier(.3,.9,.3,1) both; }

  /* 划掉的待办：整行淡下去，一眼看出这事儿已经了了 */
  .todo-done { opacity: .55; }
  .todo-done:hover { opacity: .8; }

  /* 逐字输出时的光标 */
  .caret { display: inline-block; width: 7px; height: 13px; margin-left: 2px; vertical-align: -2px; background: #22d3ee; opacity: .75; animation: blink .9s infinite; }

  /* 正在输入：三个蹦跶的小圆点 */
  .typing i { display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: #22d3ee; margin-right: 3px; }
  .typing i:nth-child(1) { animation: jumpDot .9s infinite ease-in-out; }
  .typing i:nth-child(2) { animation: jumpDot .9s .15s infinite ease-in-out; }
  .typing i:nth-child(3) { animation: jumpDot .9s .3s infinite ease-in-out; margin-right: 0; }
  @keyframes jumpDot { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

  /* 学长的思考过程：一条时间线 */
  .think-box { border-left: 2px solid rgba(34,211,238,.42); padding-left: 12px; }
  .think-box ol { list-style: decimal; }
  .think-box ol li::marker { color: rgba(148,163,184,.8); }
  .loader { width: 14px; height: 14px; border-radius: 999px; border: 2px solid rgba(251,191,36,.25); border-top-color: #fbbf24; animation: spinSlow .75s linear infinite; }

  /* 倒计时脉冲 */
  .cd-pop { animation: popPulse .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes popPulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }

  /* 勾选待办的撒花 + 成就标 */
  .confetti-bit { position: fixed; width: 8px; height: 8px; border-radius: 2px; z-index: 131; pointer-events: none; animation: dropBit .95s cubic-bezier(.3,.7,.6,1) forwards; }
  @keyframes dropBit { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
  .done-tag { position: fixed; z-index: 132; pointer-events: none; font-size: 12.5px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background-image: linear-gradient(90deg, #34d399, #22d3ee); color: #04241f; box-shadow: 0 10px 24px -8px rgba(52,211,153,.7); animation: doneTag 1.35s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes doneTag { 0% { opacity: 0; transform: translateY(8px) scale(.7); } 22% { opacity: 1; transform: translateY(-6px) scale(1.08); } 70% { opacity: 1; transform: translateY(-10px) scale(1); } 100% { opacity: 0; transform: translateY(-26px) scale(.95); } }

  /* 同学头像堆叠 */
  .avatar-stack { display: flex; align-items: center; }
  .avatar-stack > * { margin-left: -9px; border-radius: 999px; box-shadow: 0 0 0 2px var(--panel); }
  .avatar-stack > *:first-child { margin-left: 0; }

  .glow-warm { box-shadow: 0 0 0 1px rgba(251,146,60,.20), 0 18px 40px -26px rgba(251,146,60,.85); }
  .glow-mint { box-shadow: 0 0 0 1px rgba(52,211,153,.20), 0 18px 40px -26px rgba(52,211,153,.8); }
  .glow-pink { box-shadow: 0 0 0 1px rgba(244,114,182,.20), 0 18px 40px -26px rgba(244,114,182,.8); }
  .emoji-ico { font-size: 17px; line-height: 1; }

  .neon { color: #fde68a; text-shadow: 0 0 12px rgba(250, 204, 21, .85), 0 0 30px rgba(251, 146, 60, .5); letter-spacing: .04em; }
  body.light .neon { color: #b45309; text-shadow: 0 0 12px rgba(251, 191, 36, .6); }

  .nav-item { transition: all .25s ease; position: relative; }
  .nav-item:hover { background: rgba(255, 255, 255, .05); }
  body.light .nav-item:hover { background: rgba(15, 23, 42, .05); }
  .nav-item.active { background: rgba(255, 255, 255, .10); }
  body.light .nav-item.active { background: rgba(139, 92, 246, .12); }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 22px; border-radius: 0 6px 6px 0; background-image: linear-gradient(180deg, var(--acc1l), var(--acc2l)); box-shadow: 0 0 12px var(--acc1); }

  .chip { transition: all .22s ease; }
  .chip:hover { transform: translateY(-1px); }

  .md-strong { color: var(--t1); font-weight: 700; }
  .md-code { padding: 2px 6px; border-radius: 6px; background: rgba(139, 92, 246, .14); color: #67e8f9; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; border: 1px solid rgba(139, 92, 246, .22); }
  body.light .md-code { color: #0e7490; background: rgba(6, 182, 212, .12); }
  .md-mark { color: #fdba74; font-weight: 700; }
  .md-list li { position: relative; padding-left: 16px; }
  .md-list li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 99px; background-image: linear-gradient(135deg, #a78bfa, #22d3ee); }

  .msg-user { background-image: linear-gradient(90deg, var(--acc1), var(--acc2)); color: #fff; }
  .bubble-ai { background: var(--glass); border: 1px solid var(--line); }
  .tool-card { background: rgba(251, 146, 60, .07); border: 1px solid rgba(251, 146, 60, .22); }
  body.light .tool-card { background: rgba(251, 146, 60, .10); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; font-weight: 700; color: var(--t2); padding: 7px 10px; background: rgba(139, 92, 246, .10); white-space: nowrap; }
  .tbl td { padding: 7px 10px; border-top: 1px solid var(--line); color: var(--t1); white-space: nowrap; }
  .tbl tr:hover td { background: rgba(139, 92, 246, .06); }
  .tbl.wrap { table-layout: fixed; width: 100%; }
  .tbl.wrap th, .tbl.wrap td { white-space: normal; line-height: 1.55; }
  .tbl.wrap th:first-child, .tbl.wrap td:first-child { width: 26%; }

  .code-wrap { background: #06090f; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .code-body { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #a5f3fc; padding: 12px 14px; overflow-x: auto; white-space: pre; }

  #boot { position: fixed; inset: 0; z-index: 200; background: #0b1120; display: flex; align-items: center; justify-content: center; transition: opacity .5s ease, visibility .5s ease; }
  #boot.hide { opacity: 0; visibility: hidden; }
  @keyframes bootBar { from { width: 6%; } to { width: 100%; } }
  #bootBar { animation: bootBar 1.25s cubic-bezier(.3,.9,.3,1) forwards; }
  .kbd { border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; font-size: 10px; color: var(--t2); }
  .stat-card { height: 120px; }
  input, textarea, button { outline: none; }
  input::placeholder, textarea::placeholder { color: var(--t3); }
  .toast { position: fixed; right: 28px; bottom: 28px; z-index: 140; }

  /* ===== 侧边栏折叠：260px → 80px，只留图标 ===== */
  #sidebar, header, main, .campus-mark { transition: width .32s cubic-bezier(.22,.9,.3,1), left .32s cubic-bezier(.22,.9,.3,1), margin-left .32s cubic-bezier(.22,.9,.3,1); }
  body.collapsed #sidebar { width: 80px; }
  body.collapsed header { left: 80px !important; }
  body.collapsed main { margin-left: 80px !important; }
  body.collapsed .campus-mark { left: 80px; }
  body.collapsed .side-brand, body.collapsed .side-label, body.collapsed .side-status, body.collapsed .side-user-text { display: none !important; }
  body.collapsed #sidebar .px-5 { padding-left: 14px; padding-right: 14px; }
  body.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
  body.collapsed .nav-item .emoji-ico { font-size: 19px; }
  body.collapsed .nav-badge { position: absolute; top: 2px; right: 12px; margin-left: 0 !important; }
  body.collapsed #userCard { justify-content: center; }
  #collapseBtn { transition: transform .3s ease; }
  body.collapsed #collapseBtn { transform: rotate(180deg); }

  /* ===== 全局搜索：命中数提示条 ===== */
  #searchBar { position: fixed; top: 92px; left: 50%; transform: translateX(-50%) translateY(-14px); z-index: 130; opacity: 0; visibility: hidden; transition: all .28s ease;
    padding: 8px 14px; border-radius: 999px; font-size: 12px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); backdrop-filter: blur(16px); box-shadow: var(--shadow); }
  #searchBar.on { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  body.collapsed #searchBar { left: calc(50% + -90px); }

  /* ===== 关于我们 / 通用弹窗 ===== */
  #modal { position: fixed; inset: 0; z-index: 180; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(2, 6, 23, .62); opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility .28s ease; }
  #modal.open { opacity: 1; visibility: visible; }
  #modalCard { width: 720px; max-width: 96vw; max-height: 88vh; overflow-y: auto; border-radius: 20px; transform: translateY(14px) scale(.98); transition: transform .32s cubic-bezier(.22,.9,.3,1);
    background: color-mix(in srgb, var(--panel) 97%, transparent); border: 1px solid var(--line); backdrop-filter: blur(20px); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8); }
  #modal.open #modalCard { transform: translateY(0) scale(1); }

  /* ===== 全屏演示模式：把导航和顶栏收起来 ===== */
  body.demo #sidebar, body.demo header, body.demo footer, body.demo .campus-mark { display: none !important; }
  body.demo main { margin-left: 0 !important; padding-top: 24px !important; max-width: 1500px; margin-right: auto; }
  body.demo #exitDemo { display: flex !important; }
  #exitDemo { display: none; position: fixed; right: 18px; bottom: 18px; z-index: 175; }

  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .55; }
  body.light #stars { opacity: .35; }

  /* ===== 骨架屏（启动引导层里那块占位） ===== */
  .skel-card { border-radius: 16px; background: rgba(148, 163, 184, .06); border: 1px solid var(--line); padding: 14px; }
  .skel-line { height: 10px; border-radius: 99px; margin-bottom: 8px; }

  /* ===== 待办详情抽屉：从右边滑出来 ===== */
  #drawerMask { position: fixed; inset: 0; z-index: 155; background: rgba(2, 6, 23, .58); opacity: 0; visibility: hidden; transition: opacity .32s ease, visibility .32s ease; }
  #drawerMask.open { opacity: 1; visibility: visible; }
  #drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 430px; max-width: 94vw; z-index: 160; overflow-y: auto;
    background: color-mix(in srgb, var(--panel) 94%, transparent); border-left: 1px solid var(--line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: -24px 0 70px -24px rgba(0, 0, 0, .7); transform: translateX(104%); transition: transform .38s cubic-bezier(.22,.9,.3,1); }
  #drawer.open { transform: translateX(0); }
  .sub-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(148, 163, 184, .06); }
  .sub-row.done span.sub-t { text-decoration: line-through; color: var(--t3); }
  /* 拖拽排序：拖起来的那行半透明，落点那行顶上一道高亮 */

  .drag-handle { cursor: grab; }
  .drag-handle:active { cursor: grabbing; }
</style>

<body class="min-h-screen antialiased">

<!-- ============ 粒子背景 ============ -->
<canvas id="stars" aria-hidden="true"></canvas>
<!-- ============ 全屏演示模式：退出按钮 ============ -->
<button id="exitDemo" data-demoexit="1" class="btn-press items-center gap-2 px-4 h-10 rounded-full bg-grad text-white text-[12.5px] font-semibold shadow-xl">
  <i data-lucide="minimize-2" class="w-4 h-4"></i>退出演示模式（Esc）
</button>
<!-- ============ 通用弹窗（关于我们 / 新手引导） ============ -->

  let up = Math.random() < 0.5;

  const pool = mockData.classrooms.filter((c) => (c.free !== true) === up);
  if (!pool.length) return null;
  const r = pool[Math.floor(Math.random() * pool.length)];

/* 近 30 天流水：前 23 天按本周的形状做确定性扰动，最后 7 天**原样**就是 week，
   所以「近 7 天」永远是「近 30 天」的尾巴，切范围不会跟侧边栏打架 */
(function buildMonth() {
  let seed = 20261014;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const tail = mockData.week.map((d) => ({ orders: d.orders, notices: d.notices }));
  const days = [];
  const end = day0Safe();                    /* 本周周日 */
  for (let i = 29; i >= 0; i--) {
    const d = new Date(end.getTime()); d.setDate(d.getDate() - i);
    const label = (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2, '0');
    if (i < 7) {
      const t = tail[6 - i];
      days.push({ label: label, wd: WD[d.getDay()], orders: t.orders, notices: t.notices });
    } else {
      const k = (i - 7) % 7;
      const o = Math.max(2, Math.round(mockData.week[(k + 4) % 7].orders * (0.6 + rnd() * 0.85)));
      const n = Math.max(3, Math.round(mockData.week[(k + 3) % 7].notices * (0.55 + rnd() * 0.9)));
      days.push({ label: label, wd: WD[d.getDay()], orders: o, notices: n });
    }
  }
  mockData.month = days;
})();
function day0Safe() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const wd = (d.getDay() + 6) % 7;           /* 周一 = 0 */
  d.setDate(d.getDate() + (6 - wd));         /* 挪到本周周日（week 数组的最后一格） */
  return d;
}

function bjYMD(t) { /* 统一按北京时间取年月日，跟浏览器所在时区无关 */
  const d = new Date(t.getTime() + 8 * 3600e3);

function relDay(iso) {

  const days = Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';

  const mm = String(new Date(t.getTime() + 8 * 3600e3).getUTCMinutes()).padStart(2, '0');
  return d[1] + '月' + d[2] + '日 ' + hh + ':' + mm;

/* ------------------------------ Markdown 轻量渲染 ------------------------------ */
function mdInline(s) {
  let o = h(s);
  o = o.replace(/\*\*(.+?)\*\*/g, '<span class="md-strong">$1</span>');
  o = o.replace(/==(.+?)==/g, '<span class="md-mark">$1</span>');
  o = o.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
  return o;
}
function mdBlock(text) {
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if (list.length) { html += '<ul class="md-list space-y-1.5 text-[13px] t2 leading-relaxed my-1.5">' + list.join('') + '</ul>'; list = []; } };
  lines.forEach((line) => {
    const t = line.trim();
    if (!t) { flush(); return; }
    if (/^[-*]\s+/.test(t)) { list.push('<li>' + mdInline(t.replace(/^[-*]\s+/, '')) + '</li>'); return; }
    if (/^\d+\.\s+/.test(t)) { list.push('<li>' + mdInline(t) + '</li>'); return; }
    flush();
    html += '<p class="text-[13px] t1 leading-[1.8] mb-2 opacity-90">' + mdInline(t) + '</p>';
  });
  flush();
  return html;
}

function libCloseSub() {
  const now = new Date();
  const close = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 22, 0, 0, 0);
  const mins = Math.round((close - now) / 60000);
  if (mins <= 0) return '22:00 已闭馆，明早 8:00 再开';
  if (mins < 60) return '22:00 闭馆，还有 ' + mins + ' 分钟';

}

/* 「立即同步」：配了接口就真去拉，没配 / 拉不到就老实说用的是本地快照 */
async function syncFeed() {
  const btns = document.querySelectorAll('[data-feedsync]');
  btns.forEach((b) => { b.disabled = true; b.style.opacity = '.6'; });
  const url = (typeof window !== 'undefined' && window.LIVE_FEED_URL) || '';
  try {
    if (!url) {
      await new Promise((r) => setTimeout(r, 550));
      toast('演示环境没接外网：本地快照 ' + mockData.feedMeta.syncedLabel + ' 已经是最新，' + state.feed.length + ' 条都在 📡', 'warn');
      return;
    }
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    if (!Array.isArray(arr) || !arr.length) throw new Error('格式不对');
    const seen = new Set(state.feed.map((x) => x.url + '|' + x.title));
    let add = 0;
    arr.forEach((x) => {
      if (!x || !x.title || seen.has((x.url || '') + '|' + x.title)) return;
      seen.add((x.url || '') + '|' + x.title);
      state.feed.push({ id: 'live' + Date.now() + (add++), kind: x.kind === 'bid' ? 'bid' : 'news', src: x.src || '校园快讯接口', published: x.published || new Date().toISOString().slice(0, 10), url: x.url || '#', title: x.title, digest: x.digest || '', time: relDay(x.published || new Date().toISOString().slice(0, 10)) });
    });
    state.feedAt = new Date().toISOString();
    mockData.feedMeta.syncedLabel = stampLabel(state.feedAt);
    renderView();
    toast(add ? ('同步完了，新进来 ' + add + ' 条 📡') : '同步完了，没有新消息，安心 ✨', 'ok');
  } catch (err) {
    toast('没连上接口（' + err.message + '），继续用本地快照', 'warn');
  } finally {
    btns.forEach((b) => { b.disabled = false; b.style.opacity = ''; });
  }
}

/* Canvas 星点：慢速飘，不抢内容，也不吃 CPU */
function startStars() {
  const cv = document.getElementById('stars'); if (!cv || !cv.getContext) return;
  const c2 = cv.getContext('2d');
  let w = 0, h = 0, dots = [];
  const fit = () => {
    w = cv.width = window.innerWidth; h = cv.height = window.innerHeight;
    const n = Math.min(90, Math.round(w * h / 22000));
    dots = [];
    for (let i = 0; i < n; i++) dots.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.6 + .5, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18, a: Math.random() * .5 + .2 });
  };
  fit();
  window.addEventListener('resize', fit);
  const draw = () => {
    const acc = ACC(), acc2 = ACC2();
    c2.clearRect(0, 0, w, h);
    dots.forEach((d, i) => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
      if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
      c2.beginPath(); c2.arc(d.x, d.y, d.r, 0, 6.2832);
      c2.fillStyle = (i % 3 === 0 ? acc2 : acc);
      c2.globalAlpha = d.a;
      c2.fill();
    });
    c2.globalAlpha = 1;
    /* 近处的点连一根线，有点「校园星空」的意思 */
    for (let i = 0; i < dots.length; i += 3) {
      for (let j = i + 1; j < Math.min(i + 4, dots.length); j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) { c2.globalAlpha = (1 - dist / 120) * .12; c2.strokeStyle = acc; c2.beginPath(); c2.moveTo(dots[i].x, dots[i].y); c2.lineTo(dots[j].x, dots[j].y); c2.stroke(); }
      }
    }
    c2.globalAlpha = 1;
    requestAnimationFrame(draw);
  };
  draw();
}

  else if (/后天/.test(t)) { day = addDay(D, 2); dayLabel = '后天'; }
  else if (/明天|明儿|次日/.test(t)) { day = addDay(D, 1); dayLabel = '明天'; }
  else if (/今天|今儿|现在|本日/.test(t)) { day = D; dayLabel = '今天'; }
  else if ((m = t.match(/(下|这|本)?周([一二三四五六日天])/))) {
    const want = m[2] === '天' ? 0 : '日一二三四五六'.indexOf(m[2]);
    let delta = (want - D.getDay() + 7) % 7;
    if (m[1] === '下') delta += 7; else if (delta === 0) delta = 7;
    day = addDay(D, delta); dayLabel = (m[1] === '下' ? '下' : '这') + WEEKCN[want];
  }
  else if ((m = t.match(/(\d{1,2})月(\d{1,2})[日号]/))) { day = new Date(D.getFullYear(), +m[1] - 1, +m[2]); dayLabel = +m[1] + '月' + +m[2] + '日'; }
  else if ((m = t.match(/(\d{1,2})[日号]/))) { day = new Date(D.getFullYear(), D.getMonth(), +m[1]); dayLabel = dstr(day); }
  if (day && day >= D && day < addDay(D, 60)) {
    sl.date = ymd(day);
    sl.dayLabel = dayLabel;
    sl.said.push(dayLabel + '（' + dstr(day) + ' ' + WEEKCN[day.getDay()] + '）');
  }

  /* —— 时段 —— */
  if (/早上|早晨|一早|上午|早八|一二节|三四节|第[1-4]节/.test(t)) { sl.slot = '08:00-12:00'; sl.slotLabel = '上午'; }
  else if (/中午|午休|午饭|午间/.test(t)) { sl.slot = '12:00-14:00'; sl.slotLabel = '中午'; }
  else if (/下午|午后/.test(t)) { sl.slot = '13:00-18:00'; sl.slotLabel = '下午'; }
  else if (/晚上|傍晚|今晚|夜里|晚自习|晚课/.test(t)) { sl.slot = '18:00-22:00'; sl.slotLabel = '晚上'; }
  if ((m = t.match(/(\d{1,2})[:：](\d{2})/))) { sl.slot = String(+m[1]).padStart(2, '0') + ':' + m[2]; sl.slotLabel = m[1] + ':' + m[2]; }
  if (sl.slotLabel) sl.said.push(sl.slotLabel);

  /* —— 人数 —— */
  if ((m = t.match(/(\d{2,4})\s*人/))) sl.cap = +m[1];
  else if (/小组|讨论|组会|开会|面试|答辩|团建/.test(t)) sl.cap = 6;
  else if (/大教室|大点的|能装很多|人多一点/.test(t)) sl.cap = 80;
  if (sl.cap) sl.said.push('至少坐得下 ' + sl.cap + ' 人');

  /* —— 插座 —— */
  if (/不用插座|不要插座|没插座也行|插座无所谓/.test(t)) { sl.socket = false; sl.said.push('插座不强求'); }
  else if (/插座|充电|电源|插口/.test(t)) { sl.socket = true; sl.said.push('要带插座'); }

  /* —— 楼栋 / 房间号 —— */
  if ((m = t.match(/([一二三四五六七八九十]{1,3}|\d{1,2})号楼/))) {
    const b = /^\d+$/.test(m[1]) ? +m[1] : CN_NUM[m[1]];
    if (b) { sl.building = cnNum(b) + '号楼'; sl.said.push(cnNum(b) + '号楼'); }
  }
  if ((m = t.match(/(\d{4})/)) && !sl.cap && /教室|房间|间|抢|占|订|预约/.test(t)) sl.room = m[1];

  /* —— 图书馆楼层 —— */
  if (/图书馆|文华公书林|自习|研讨/.test(t) && !/\d号楼/.test(t) && (m = t.match(/(\d{1,2})楼/))) {
    sl.floor = +m[1]; sl.said.push(m[1] + '楼');
  }

  /* —— 具体食堂 —— */
  ['桂香园', '博雅园', '沁园春'].forEach((c) => { if (t.indexOf(c) >= 0) { sl.canteen = c; sl.said.push(c); } });

  /* —— 借还书 / 逾期 —— */
  if (/借书|还书|借阅|续借|逾期|罚钱/.test(t) || (/到期/.test(t) && /书|还|借/.test(t))) sl.book = true;

  /* —— 通知主题 / 用途 / 偏好 —— */
  TOPICS.forEach((x) => { if (!sl.topic && x.re.test(t)) sl.topic = x.k; });
  PURPOSES.forEach((x) => { if (x.re.test(t)) sl.purpose = x.k; });
  if (/安静|清净|别吵/.test(t)) sl.quiet = true;
  if ((m = t.match(/(\d+)\s*[间个]/))) sl.count = Math.min(6, Math.max(2, +m[1]));
  return sl;
}

/* ---------------- 2. 字粒度相似度：没见过的说法也能落到对的门里 ---------------- */
function grams(x) { const g = []; for (let i = 0; i < x.length - 1; i++) g.push(x.slice(i, i + 2)); return g; }
function dice(a, b) {
  if (!a || !b) return 0;
  const A = grams(a), B = grams(b);
  if (!A.length || !B.length) return a === b ? 1 : 0;
  const pool = {}; B.forEach((x) => { pool[x] = (pool[x] || 0) + 1; });
  let n = 0; A.forEach((x) => { if (pool[x]) { n++; pool[x]--; } });
  return (2 * n) / (A.length + B.length);
}

function rankIntents(t) {
  const out = [];
  INTENTS.forEach((it) => {
    let sc = 0, hits = 0;
    for (const k in it.w) { if (t.indexOf(k) >= 0) { sc += it.w[k]; hits++; } }
    if (it.rx) it.rx.forEach((r) => { if (r[0].test(t)) sc += r[1]; });
    let sim = 0;
    (it.samples || []).forEach((x) => { const v = dice(norm(x), t); if (v > sim) sim = v; });
    /* 有的意图必须"看得见实据"才准触发：关键词不够、长得也不像，就直接出局 */
    if (it.need && sc < it.need && sim < 0.5) return;
    sc += (sc > 0 ? 5 : 7.5) * sim;   /* 一句关键词都没撞上时，靠相似度兜 */
    if (sc > 0.2) out.push({ id: it.id, sc: Math.round(sc * 100) / 100, hits, sim: Math.round(sim * 100) / 100 });
  });
  out.sort((a, b) => b.sc - a.sc);
  return out;
}
function pickIntent(text) {
  const r = rankIntents(norm(text));
  return r.length && r[0].sc >= MATCH ? r[0].id : 'general';
}

    const said = (sl.said && sl.said.length) ? sl.said.join('、') : '';
    const tip = pick([
      '文华公书林 10月18日 8:00-14:00 闭馆维护，别白跑。',
      '宿舍校园网 10月21日 0:00-4:00 要断 4 小时，提前把资料下好。',
      '校医院流感疫苗 10月20日 起能约了，别挤第一天。',
      '热水时间改了：6:00-8:30 / 11:30-13:30 / 17:30-23:30，洗澡看好点儿。'
    ]);
    return finish({
      plan: ['这句话我没太听准，不瞎猜', said ? '不过我抓到了这些线索：' + said : '先把能问的列给你'],
      tools: [{ name: 'intent_clarify', label: '先问清楚', args: jstr({ heard: said || undefined, threshold: MATCH, decision: 'ask_user' }), ms: rand(160, 300), hits: 0, warn: true }],
      answer: '宝子这句我没太听准，先不瞎猜 🙂' + (said ? '\n\n我只听出来你说的是「' + said + '」，但不知道你想让我干啥。' : '') + '\n\n换个说法试试，比如：\n- 「明天下午有空教室吗，要能坐 30 人」\n- 「奖学金申请还差哪些材料」\n- 「桂香园现在人多吗」\n- 「运动会还有几天」',
      tail: '💡 顺手告诉你一条：' + tip,
      quick: [{ label: '明天下午有空教室吗', act: 'ask', q: '明天下午有空教室吗' }, { label: '你还会啥', act: 'ask', q: '学长你还会啥' }]
    }, 'general', sl);
  }
};

/* —— 短命令：「就它了 / 算了」，不靠关键词，靠上下文 —— */
function commandFollow(t) {
  const c = ctx();
  if (!c.last || t.length > 16) return null;

  /* ① 确认下单 */
  if (/^(就它了|就这个|就这间|这个吧|就要这个|来这个|好的?|行吧|可以的|要了|要这个|就要|要|嗯+|对|ok|没问题|帮我抢|订了|占上|就订|抢吧)(吧|了|呀|啊|哈|！|!|。|~)?$/i.test(t) && c.offered.length) {
    const r = c.offered[0];
    return BUILDERS.book(Object.assign({}, c.slots, { room: r.room.split(' ')[1], building: r.building, cap: r.cap }), { fromConfirm: true, room: r });
  }
  /* ② 算了 */
  if (/^(算了|不用了|不要了|取消|先不|不用)/.test(t)) {
    return finish({
      plan: ['收到，撤单', '把刚才推的那几间放回池子里'],
      tools: [{ name: 'cancel', label: '撤回', args: jstr({ action: 'cancel_last' }), ms: 160, hits: 1 }],
      answer: '行，撤了 👌 那几间我不占了，先给你留着。',
      tail: '改主意随时喊我，这两间这个点一般不会被人秒光。',
      quick: [{ label: '还有别的空教室吗', act: 'ask', q: '还有别的空教室吗' }, { label: '我今天还有啥没干', act: 'ask', q: '我今天还有啥没干' }]
    }, 'cancel', c.slots);
  }
  return null;
}

/* —— 只补/改了一个条件（「那七号楼呢」「换个时间」）：沿用上一轮的事，只换条件 ——
   注意：只有在主意图没听出来的时候才会走到这儿，不会抢正经提问 */
function rebuildSaid(m) {
  const arr = [];
  if (m.dayLabel) arr.push(m.dayLabel);
  if (m.slotLabel) arr.push(m.slotLabel);
  if (m.cap) arr.push('至少坐得下 ' + m.cap + ' 人');
  if (m.socket === true) arr.push('要带插座');
  if (m.building) arr.push(m.building);
  if (m.canteen) arr.push(m.canteen);
  if (m.floor) arr.push(m.floor + ' 楼');
  if (m.topic) arr.push(m.topic);
  return arr;
}
function refineFollow(t, sl) {
  const c = ctx();
  if (!c.last || !BUILDERS[c.last]) return null;
  if (['general', 'risky', 'cancel'].indexOf(c.last) >= 0 || String(c.last).indexOf('smalltalk') === 0) return null;
  if (t.length > 16) return null;
  /* 「还有别的吗」：同技能的备选翻页，不该把刚才那几间再报一遍 */
  if (/还有|别的|其他|其它|再来|再给|换一批|换个/.test(t) && c.offered.length) {
    if (c.last === 'classroom') return BUILDERS.classroom(c.slots, { exclude: c.offered.map((x) => x.room) });
    return finish({
      plan: ['翻一遍备选', '这个技能手里就这些了，如实说'],
      tools: [{ name: 'exhaust', label: '翻备选', args: jstr({ intent: c.last }), ms: 180, hits: 0 }],
      answer: '这项我手里就这些了宝子，不糊弄你 🙌\n\n要不换个方向？下面这几个我随时能接：',
      quick: [{ label: '明天下午有空教室吗', act: 'ask', q: '明天下午有空教室吗' }, { label: '最近有啥通知', act: 'ask', q: '最近有什么重要通知' }]
    }, c.last, c.slots);
  }
  const KEYS = ['building', 'floor', 'slotLabel', 'canteen', 'topic', 'cap', 'date', 'dayLabel', 'room'];
  const added = KEYS.some((k) => sl[k] !== undefined && String(sl[k]) !== String(c.slots[k]));
  const pointer = /呢$|^那|^换|^改|^另外|^再/.test(t);
  if (!pointer && !(added && t.length <= 8)) return null;
  const merged = Object.assign({}, c.slots, sl);
  merged.said = rebuildSaid(merged);
  const r = BUILDERS[c.last](merged, { follow: true });
  if (!r.plan.length || r.plan[0].indexOf('听懂了') !== 0) {
    r.plan[0] = '接着上一句，只换了个条件：' + (merged.said.slice(-1)[0] || '换个说法');
  }
  return r;
}

/* —— 组合拳：一句话里问了两件事，就干两件事 —— */
function comboResponse(picks, sl, t) {
  const parts = picks.map((p) => BUILDERS[p.id](sl, {}));
  const a = parts[0], b = parts[1];
  const ids = picks.map((p) => p.id).join(' + ');
  return finish({
    plan: ['这一句里有两件事，我分开办：' + picks.map((p) => INTENT_OF(p.id).label).join(' + '),
          '先办「' + INTENT_OF(picks[0].id).label + '」，再顺手把「' + INTENT_OF(picks[1].id).label + '」也跑了',
          '两边的结论都给你，省得你再问一遍'],
    tools: (a.tools || []).concat(b.tools || []),
    answer: a.answer,
    table: a.table,
    more: (b.table ? [{ title: '—— 另外一句，' + INTENT_OF(picks[1].id).label + '也跑完了 ——', table: b.table }] : []).concat(a.more || []),
    tail: b.tail || a.tail,
    quick: (a.quick || []).slice(0, 1).concat((b.quick || []).slice(0, 1)),
    offered: picks[0].id === 'classroom' ? (a.offered || []) : []
  }, ids, sl);
}

/* —— 差不多像但不敢确定：把猜的摆出来让你选 —— */
function clarify(best, ranked, sl, t) {
  const it = INTENT_OF(best.id);
  const other = ranked.slice(1).filter((x) => x.sc >= CLARIFY).slice(0, 2).map((x) => INTENT_OF(x.id));
  return finish({
    plan: ['这句有两种可能的意思，我不猜死', '把两种都摆出来，你点一下就行'],
    tools: [{ name: 'intent_clarify', label: '先问清楚', args: jstr({ guess: it.id, confidence: best.sc, alt: other.map((x) => x.id) }), ms: rand(160, 300), hits: other.length + 1, warn: true }],
    answer: '你这句我有两种理解，帮我点一下哪个对 🙂\n\n① 你想问的是 **' + it.label + '**？\n' + (other.length ? '② 还是想问 **' + other.map((x) => x.label).join(' / ') + '**？\n' : ''),
    tail: '或者直接把想要的说得更具体点，比如带上「时间 / 人数 / 地点」，我一次就到位。',
    quick: [{ label: '是「' + it.label + '」', act: 'ask', q: it.samples[0] }].concat(other.map((x) => ({ label: '是「' + x.label + '」', act: 'ask', q: x.samples[0] })))
  }, it.id, sl);
}

/* —— 收尾：把这一轮的记忆存下来 —— */
function finish(res, id, sl) {
  const c = ctx();
  c.last = id; c.slots = sl || {}; c.offered = res.offered || []; c.turn++;
  res.intent = id;
  if (!res.plan || !res.plan.length) res.plan = planOf(id, sl);
  return res;
}

/* ---------------- 7. 入口 ---------------- */
function withRetry(res, text) { res.retry = text; return res; }
function retryHTML(q) {
  return '<div class="mt-3 flex items-center gap-2 flex-wrap"><span class="text-[10.5px] t3">没答到点上？</span>' +
    '<button data-quick="' + h(q) + '" data-act="retry" class="chip btn-press flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11.5px] t1" style="background: rgba(6,182,212,.14); border:1px solid rgba(6,182,212,.32)">' + icon('rotate-ccw', 'w-3.5 h-3.5') + '重试一次</button>' +
    '<span class="text-[10.5px] t3">或者换个说法，带上「时间 / 人数 / 地点」</span></div>';
}
function buildResponse(text) {
  const t = norm(text);
  const sl = parseSlots(text);

  /* 空输入 / 纯标点 */
  if (!t || !/[一-龥a-z0-9]/.test(t)) {
    const c = ctx();
    const last = c.last && BUILDERS[c.last] ? INTENT_OF(c.last) : null;
    if (last) return withRetry(finish({
      plan: ['没看清你发了啥，我接着上一句往下问'],
      tools: [{ name: 'intent_clarify', label: '先问清楚', args: jstr({ reason: 'empty_input' }), ms: 140, hits: 0, warn: true }],
      answer: '消息有点空宝子 😅 我们刚聊到 **' + last.label + '**，需要我接着说吗？',
      quick: [{ label: '接着说', act: 'ask', q: last.samples[0] }, { label: '换个话题', act: 'ask', q: '学长你还会啥' }]
    }, c.last, c.slots), text);
    return socialReply(SOCIAL.find((x) => x.k === 'test'));
  }

  /* 引用一条通知问「我该干啥」——直接定位到那条 */
  const q = text.match(/[「『"]([^」』"]{4,60})[」』"]/);
  if (q) {
    const n = mockData.notifications.find((x) => x.title.indexOf(q[1].slice(0, 10)) >= 0 || q[1].indexOf(x.title.slice(0, 8)) >= 0);
    if (n) {
      const tp = TOPICS.find((x) => x.re.test(n.title + n.body));
      const r = BUILDERS.notice(Object.assign({}, sl, { topic: tp ? tp.k : null }));
      r.answer = '这条我帮你拆完了：**' + n.title + '**\n\n- 谁发的：' + n.src + '\n- 原话：' + n.body;
      r.tools[0].args = jstr({ q: n.title.slice(0, 16), scope: [n.src] });
      r.tail = '要我把它记进日历、到点喊你吗？一句话的事。';
      r.quick = [{ label: '记进日历', act: 'ask', q: '把「' + n.title.slice(0, 10) + '」记进日历' }, { label: '这类通知还有啥', act: 'ask', q: '最近有什么重要通知' }];
      return finish(r, 'notice', Object.assign({}, sl, { topic: tp ? tp.k : null }));
    }
  }

  const ranked = rankIntents(t);
  const best = ranked[0] || { id: 'general', sc: 0 };
  const soc = SOCIAL.find((s) => s.re.test(t));
  const wantMulti = /顺便|另外|还有|以及|同时|再帮我|然后再/.test(t) || /[，,。；;]/.test(t);

  /* 「就它了 / 好的 / 算了」这类短命令，先按上下文接住 */
  const cmd0 = commandFollow(t);
  if (cmd0) return cmd0;

  /* 社交优先于「猜意图」，但真问事的时候让位给正事 */
  if (soc && best.sc < soc.t) return socialReply(soc);

  /* 一句话两件事 */
  if (wantMulti) {
    const chunks = t.split(/[，,。；;!！?？]|顺便|另外|以及|同时|再帮我|然后再|还有/).map((x) => x.trim()).filter((x) => x.length >= 2);
    if (chunks.length >= 2) {
      const picks = [];
      chunks.forEach((p) => {
        const r0 = rankIntents(p)[0];
        if (r0 && r0.sc >= MATCH && !picks.some((x) => x.id === r0.id)) picks.push(r0);
      });
      if (picks.length >= 2) {
        if (picks[0].id === 'risky' || picks[1].id === 'risky') return BUILDERS.risky(sl);
        return comboResponse(picks.slice(0, 2), sl, t);
      }
    }
  }

  /* 主意图够硬 → 直接办 */
  if (best.sc >= MATCH) {
    const it = INTENT_OF(best.id);
    const c = ctx();
    if (it.id === 'risky') return BUILDERS.risky(sl);
    /* 「还有别的空教室吗」是同技能的翻页，不该把刚才那几间再报一遍 */
    if (c.last === it.id && c.offered.length && /还有|别的|其他|其它|再来|再给|换一批|换个/.test(t)) {
      if (it.id === 'classroom') return BUILDERS.classroom(sl, { exclude: c.offered.map((x) => x.room) });
    }
    return BUILDERS[it.id] ? BUILDERS[it.id](sl, {}) : BUILDERS.general(sl);
  }

  /* 意图很弱 → 只补了个条件 / 社交 / 澄清 / 兜底 */
  const rf = refineFollow(t, sl);
  if (rf) return rf;
  if (soc) return socialReply(soc);
  if (best.sc >= CLARIFY) return withRetry(clarify(best, ranked, sl, t), text);
  return withRetry(BUILDERS.general(sl), text);
}

/* 逐字吐答案：只在标签外面切，绝不把 <div> 切成两半；吐完再把下面的卡片淡入 */
function streamHTML(el, html) {
  const safe = [];
  let inTag = false;
  for (let i = 0; i < html.length; i++) {
    const ch = html.charAt(i);
    if (ch === '<') inTag = true;
    else if (ch === '>') inTag = false;
    if (!inTag) safe.push(i + 1);
  }
  const total = safe.length;
  if (!total) { el.innerHTML = html; return Promise.resolve(); }
  const step = Math.max(1, Math.round(total / 80));   /* 大约 80 帧吐完，长答案快一点、短答案慢一点 */
  let k = 0;
  return new Promise((resolve) => {
    const timer = setInterval(() => {
      k = Math.min(total, k + step);
      el.innerHTML = html.slice(0, safe[k - 1] || 0) + '<span class="caret"></span>';
      const l = document.getElementById('msgList');
      if (l && k % (step * 6) < step) l.scrollTop = l.scrollHeight;
      if (k >= total) { clearInterval(timer); el.innerHTML = html; resolve(); }
    }, 16);
  });
}
function chatWrap(create) {
  const l = $('#msgList'); if (!l) return null;
  if (!l.firstElementChild && create !== false) l.innerHTML = '<div class="space-y-5"></div>';
  return l.firstElementChild;
}
function scrollChat() { const l = $('#msgList'); if (l) l.scrollTo({ top: l.scrollHeight, behavior: 'smooth' }); }
function pushUser(text) {
  const rec = { role: 'user', text: text, time: hhmm() };
  state.chat.push(rec);
  const w = chatWrap(); if (!w) return;
  w.insertAdjacentHTML('beforeend', messageHTML(rec, state.chat.length));
  icons(); scrollChat();
}
function thinkingHTML(label) {
  return '<div class="flex items-center gap-2 text-[12px] t2"><span class="typing"><i></i><i></i><i></i></span><span>' + h(label) + '</span></div>';
}
/* 思考过程的壳：先出现，然后按 0.5s / 1s / 2s / 3s 往里插节点，4s 连壳一起换掉 */
function thinkBoxHTML() {

    '<div class="flex items-center gap-1.5 text-[10.5px] t3 font-mono mb-2">' + icon('activity', 'w-3 h-3') +

/* =========================================================================
 * 可选：接真实大模型（国产 API）
 * 不配 key 时走下面的本地 Mock 引擎，演示零成本、断网也能跑；
 * 把 apiKey 填上、enabled 改成 true，同一个发送流程就会先问真模型，
 * 请求失败或超时自动回落到本地学长，演示永远不会开天窗。
 * ========================================================================= */
const LLM_PERSONA = '你是「华大万事通 · AI学长」，华大的一个老学长，帮学弟学妹跑校园里的杂事。'
  + '说话像真人学长：用「宝子」「冲」「鸭」这类词，可以带颜文字，别用「系统」「成功率」「响应时间」这种运维黑话。'
  + '不知道的就说不确定，涉及成绩、缴费、审批这类敏感操作要明确说「这个得你自己来」，并给操作路径。回答用 Markdown。';
const LLM_CONFIG = {
  enabled: false,                 /* ← 填好 apiKey 后改成 true */
  apiKey: '',                     /* ← 智谱 / 通义 的 API Key 粘这里 */
  model: 'glm-4-flash',
  endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
  timeout: 8000
};
const LLM_PRESETS = {
  zhipu: { endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash' },
  qwen: { endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-turbo' }
};
function llmReady() { return !!(LLM_CONFIG.enabled && LLM_CONFIG.apiKey); }
async function llmCall(text) {
  if (!llmReady()) return null;
  const ctrl = new AbortController();
  const timer = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, LLM_CONFIG.timeout || 8000);
  try {
    const r = await fetch(LLM_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + LLM_CONFIG.apiKey },
      body: JSON.stringify({
        model: LLM_CONFIG.model,
        messages: [{ role: 'system', content: LLM_PERSONA }].concat(
          /* 把最近几轮对话一起带上，「刚才那个通知」这种指代才接得住 */
          state.chat.slice(-6).map((m) => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.role === 'user' ? m.text : (m.answer || '') })).filter((m) => m.content),
          [{ role: 'user', content: text }]
        ),
        temperature: 0.7
      }),
      signal: ctrl.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const out = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    return out ? String(out).trim() : null;
  } catch (e) {
    console.warn('[LLM] 真模型没答上来，自动回落本地学长：', e.message);
    return null;
  } finally { clearTimeout(timer); }
}

async function runAgent(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (state.busy) { toast('学长还在忙上一条呢，稍等我一下 🏃', 'warn'); return; }
  if (state.view !== 'dashboard') { state.view = 'dashboard'; renderView(); }
  state.busy = true;
  pushUser(text);
  const res = buildResponse(text);
  const w = chatWrap();
  if (!w) { state.busy = false; return; }

  const tool0 = (res.tools && res.tools[0]) || { label: '通知挖掘机', name: 'notice_search', hits: 3 };
  const hits = tool0.hits || 0;

  /* 挂上思考过程的气泡：4 秒后整块换成最终回复 */
  const holder = document.createElement('div');
  holder.className = 'flex gap-3 rise';
  holder.innerHTML = agentAvatar() + '<div class="min-w-0 flex-1 max-w-[88%]"><div class="bubble-ai px-4 py-3.5 rounded-2xl rounded-tl-sm">' + thinkBoxHTML() + '</div></div>';
  w.appendChild(holder); icons(); scrollChat();
  const bubble = holder.lastElementChild.firstElementChild;
  const list = bubble.querySelector('[data-thinklist]');
  const addRow = (html) => { list.insertAdjacentHTML('beforeend', '<div class="rise">' + html + '</div>'); icons(); scrollChat(); };

  /* 真模型和动画并行跑：动画照常走 4 秒，谁先回来都不耽误演示 */
  const llmPromise = llmReady() ? llmCall(text) : null;

  /* ── 0.5s：学长正在思考...（三个跳动的小圆点） ────────────────── */
  await sleep(500);
  addRow(thinkingHTML('学长正在思考...'));

  /* ── 1.0s：学长的思路 ───────────────────────────────────────── */
  await sleep(500);
  addRow('<div class="text-[12px] t1"><span class="font-semibold">学长的思路：</span>' +
    '<span class="t2">1. 听懂你要干啥 → 2. 调用工具 → 3. 总结</span></div>' +
    '<ol class="mt-1.5 space-y-1 pl-5">' + res.plan.map((p) =>
      '<li class="text-[11px] t3 leading-relaxed">' + h(p) + '</li>').join('') + '</ol>');

  /* ── 2.0s：正在调用工具 + 旋转 Loading ───────────────────────── */
  await sleep(1000);
  addRow('<div data-think-tool="1" class="flex items-center gap-2 text-[12px] t2">' +
    '<span class="loader shrink-0"></span>' +
    '<span>正在调用工具：<b class="t1">' + h(tool0.label) + '</b> ' +
    '<code class="font-mono text-[10.5px] t3">(' + h(tool0.name) + ')</code></span></div>');

  /* ── 3.0s：命中 N 条数据 + 绿色对勾（同一个节点就地变身） ──────── */
  await sleep(1000);
  const toolRow = list.querySelector('[data-think-tool]');
  if (toolRow) {
    toolRow.innerHTML = '<span class="shrink-0 text-emerald-400">' + icon('check-circle', 'w-4 h-4') + '</span>' +
      '<span class="t2">命中 <b class="text-emerald-400">' + hits + '</b> 条数据</span>';
    icons();
  }

  /* ── 4.0s：输出最终 Markdown 结果，中间过程整块移除 ──────────── */
  await sleep(1000);
  let real = null;
  if (llmPromise) { try { real = await llmPromise; } catch (e) { real = null; } }
  if (real) { res.answer = real; state.usedLLM = true; } else { state.usedLLM = false; }

  let mid = '';
  if (res.table) mid += tableHTML(res.table);
  (res.more || []).forEach((sec) => {
    if (!sec || !sec.table) return;
    mid += '<div class="text-[11.5px] t3 font-mono mt-4 mb-1">' + h(sec.title || '') + '</div>' + tableHTML(sec.table);
  });
  if (res.code) mid += codeHTML(res.code);
  if (res.tail) mid += '<p class="text-[13px] t2 leading-relaxed mt-1.5 opacity-90">' + mdInline(res.tail) + '</p>';
  const restHTML = mid + (res.tools || []).map(toolHTML).join('') +
    (res.retry ? retryHTML(res.retry) : '') + quickHTML(res.quick) + stampHTML({ time: hhmm() });
  bubble.innerHTML = '<div class="answer">' + mdBlock(res.answer) + '</div><div data-rest="1" style="opacity:0; transition:opacity .35s ease">' + restHTML + '</div>';
  icons(); scrollChat();
  /* —— 正文逐字写出来，写完下面那块（工具卡片 / 表格 / 按钮）淡入 —— */
  const ansEl = bubble.querySelector('.answer');
  if (ansEl) {
    const full = ansEl.innerHTML;
    ansEl.innerHTML = '';
    await streamHTML(ansEl, full);
  }
  const restEl = bubble.querySelector('[data-rest]');
  if (restEl) restEl.style.opacity = '1';
  icons(); scrollChat();
  state.chat.push({ role: 'assistant', time: hhmm(), plan: res.plan, tools: res.tools, answer: res.answer, table: res.table, code: res.code, tail: res.tail, quick: res.quick });
  state.busy = false;
}

function toggleTodoDone(id) {

    const parts = cb.getAttribute('data-sub').split(':');

  });

  /* ③ 拖拽排序：HTML5 原生 DnD，落点那行顶上一道高亮，松手就换位置 */
  let dragId = null;
  document.addEventListener('dragstart', (e) => {
    const r = (e.target.closest ? e.target.closest('[data-trow][draggable="true"]') : null);
    if (!r) return;
    dragId = r.getAttribute('data-trow');

  });
  document.addEventListener('dragover', (e) => {
    if (dragId == null) return;
    const r = (e.target.closest ? e.target.closest('[data-trow][draggable="true"]') : null);
    if (!r || r.getAttribute('data-trow') === dragId) return;
    e.preventDefault();
    document.querySelectorAll('.drag-row.drop-hint').forEach((x) => { if (x !== r) x.classList.remove('drop-hint'); });
    r.classList.add('drop-hint');
  });
  document.addEventListener('drop', (e) => {
    if (dragId == null) return;
    const r = (e.target.closest ? e.target.closest('[data-trow][draggable="true"]') : null);
    const from = state.todos.findIndex((x) => String(x.id) === dragId);
    if (!r || from < 0) return;
    e.preventDefault();
    const at = state.todos.findIndex((x) => String(x.id) === r.getAttribute('data-trow'));
    if (at < 0 || at === from) return;
    const moved = state.todos.splice(from, 1)[0];
    state.todos.splice(at, 0, moved);
    dragId = null;
    renderView();
    toast('顺序调好了，排在前面的先干 💪', 'ok');
  });
  document.addEventListener('dragend', () => {
    dragId = null;
    document.querySelectorAll('.drag-row').forEach((x) => x.classList.remove('dragging', 'drop-hint'));
  });
}

function buildTranscript() {
  const lines = ['# 华大万事通 · AI学长 会话记录', '', '- 导出时间：' + new Date().toLocaleString('zh-CN'), '- 用户：' + mockData.user.name + '（' + mockData.user.studentId + '）', '- 说明：本记录由本地 Mock 学长生成，用于 1024 Hackathon 演示', ''];
  state.chat.forEach((m) => {
    if (m.role === 'user') { lines.push('## 我'); lines.push(''); lines.push(m.text || ''); lines.push(''); return; }
    lines.push('## AI学长' + (m.time ? '（' + m.time + '）' : ''));
    lines.push('');
    if (m.plan) { lines.push('**学长的思路**'); m.plan.forEach((p, i) => lines.push((i + 1) + '. ' + p)); lines.push(''); }
    (m.tools || []).forEach((t) => lines.push('> 用了「' + (t.label || t.name) + '」' + (t.warn ? ' · 被学长拦下了' : ' · 搞定')));
    if (m.tools && m.tools.length) lines.push('');
    if (m.answer) { lines.push(m.answer); lines.push(''); }
    (m.more || []).forEach((sec) => { if (sec && sec.table) { lines.push('**' + sec.title + '**'); lines.push(''); lines.push('| ' + sec.table.head.join(' | ') + ' |'); lines.push('| ' + sec.table.head.map(() => '---').join(' | ') + ' |'); sec.table.rows.forEach((r) => lines.push('| ' + r.join(' | ') + ' |')); lines.push(''); } });
    if (m.table) { lines.push('| ' + m.table.head.join(' | ') + ' |'); lines.push('| ' + m.table.head.map(() => '---').join(' | ') + ' |'); m.table.rows.forEach((r) => lines.push('| ' + r.join(' | ') + ' |')); lines.push(''); }
    if (m.code) { lines.push('```' + m.code.lang); lines.push(m.code.body); lines.push('```'); lines.push(''); }
    if (m.tail) { lines.push(m.tail); lines.push(''); }
  });
  return lines.join('\n');
}

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

  $('#bellBtn').addEventListener('click', () => {
    const open = toggleBellPop();
    if (open) toast(state.unread ? ('未读 ' + state.unread + ' 条，重点我都标好了 👉') : '没有未读啦，随便看看也行');
  });
  window.addEventListener('resize', () => { state.charts.forEach((c) => { try { c.resize(); } catch (e) {} }); });
}
function submitChat() {
  const i = $('#chatInput'); if (!i) return;
  const v = i.value.trim(); if (!v) return;
  i.value = ''; runAgent(v);
}
/* addTodo 已上移：新版会按关键词挑 emoji，并且加完自动滑出详情抽屉 */
function bindDelegatedButtons() {
  document.addEventListener('click', (e) => {
    if (e.target.closest('#sendBtn')) submitChat();
    if (e.target.closest('#addTodo')) addTodo();
    if (e.target.closest('#readAll')) { readAllNotifs(); }
    if (e.target.closest('[data-nreadall]')) { readAllNotifs(); }
    if (e.target.closest('[data-bellclose]')) { toggleBellPop(false); }
  });
}

/* ------------------------------ 依赖自检（断网降级提示） ------------------------------ */
function degradedCheck() {
  const probe = document.createElement('div');
  probe.className = 'grid';
  probe.style.cssText = 'position:absolute;left:-9999px;top:0';
  document.body.appendChild(probe);
  const twOk = getComputedStyle(probe).display === 'grid';
  probe.remove();
  const miss = [];
  if (!twOk) miss.push('Tailwind CSS（页面样式）');
  if (!window.lucide) miss.push('Lucide（图标）');
  if (!window.echarts) miss.push('ECharts（图表，已降级成内置 SVG 折线）');
  if (!miss.length) return;
  const el = document.createElement('div');
  el.className = 'glass-card px-4 py-3 text-[11.5px] t1 max-w-[560px]';
  el.style.cssText = 'position:fixed;left:280px;bottom:20px;z-index:150;border-color:rgba(245,158,11,.45);background:rgba(120,53,15,.35)';
  el.innerHTML = '<div class="flex items-start gap-2">' + icon('alert-triangle', 'w-4 h-4 text-amber-300 shrink-0 mt-[1px]') +
    '<div><div class="font-semibold mb-1">有几个外部资源没加载上（当前网络不通）</div>' +
    '<div class="t2 leading-relaxed">缺的是：' + h(miss.join('、')) + '。<br/>联网后刷新一下就好；也可以直接把 <b class="t1">vendor/</b> 文件夹和本文件放同一层，就能完全离线演示。</div></div></div>';
  document.body.appendChild(el); icons();
}

/* ------------------------------ 启动 ------------------------------ */
function boot() {
  const logs = [
    '[ok] 学长起床了 · 洗漱完毕',
    '[ok] 技能树点亮 ' + mockData.tools.length + ' 项 · 扒通知 / 抢教室 / 干饭雷达 …',
    '[ok] 摸清你的课表与日程 ' + (state.todos.length) + ' 条',
    '[ok] 攒了 ' + state.notifs.length + ' 条通知，重点已经划好',
    '[ok] 记住了一条底线：涉及隐私和不可撤回的操作，先说清楚再不动手',
    '[ready] 华大万事通 · AI学长，随时听你喊'
  ];
  const box = $('#bootLog');
  logs.forEach((l, i) => setTimeout(() => { if (box) box.innerHTML += '<div class="' + (i === logs.length - 1 ? 'text-orange-300' : '') + '">' + h(l) + '</div>'; }, i * 170));
  setTimeout(() => {
    try {
      if (localStorage.getItem('ccnu-theme') === 'light') { document.body.classList.add('light'); $('#themeBtn').innerHTML = icon('moon', 'w-[18px] h-[18px] t2'); }
      const ac = localStorage.getItem('ccnu-accent'); if (ac && ac !== 'purple') setThemeColor(ac, true);
      if (localStorage.getItem('ccnu-collapsed') === '1') setCollapsed(true, true);
    } catch (e) {}
    $('#boot').classList.add('hide');
    setTimeout(() => { const b = $('#boot'); b && b.remove(); }, 600);
    state.booted = true;
  }, 1600);

  icons();
  startStars();
  renderSidebar();
  renderHeader();
  bindEvents();
  bindTodoUX();
  bindDelegatedButtons();
  renderView();
  syncNotifUI();   /* 未读数字在侧栏 / 铃铛 / 概览三处必须同源，启动时也对一次 */
  tickCountdown();
  setInterval(tickCountdown, 1000);
  /* 教室占用心跳：每 8 秒模拟一次「下课 / 上课」，统计卡与筛选表一起动 */
  setInterval(() => { if (tickRooms()) refreshRooms(); }, 8000);
  let vi = 0;
  setInterval(() => { const el = $('#vibeLine'); if (el) { vi = (vi + 1) % mockData.vibes.length; el.textContent = mockData.vibes[vi]; } }, 4200);
  setInterval(() => { const el = $('#footClock'); if (el) el.textContent = '本地时间 ' + hhmm() + ' · 学长在浏览器里跑，不联网也能用'; }, 20000);
  setTimeout(() => toast('学长上线啦～今天想让我帮你干点啥？'), 2200);
  setTimeout(degradedCheck, 1200);
}
boot();
</script>
</body>
</html>
