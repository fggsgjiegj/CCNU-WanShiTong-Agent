<style>
  :root {
    --bg: #0f172a;
    --panel: #0b1120;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-hover: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.10);
    --line-strong: rgba(255, 255, 255, 0.20);
    --t1: #f8fafc;
    --t2: #94a3b8;
    --t3: #64748b;
    --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    --warm: #fb923c; --mint: #34d399; --pink: #f472b6; --lemon: #facc15;
    /* 主题色：整套渐变（按钮 / 标题 / 选中态）都读这两个变量，换色不用改样式表 */
    --acc1: #8b5cf6; --acc2: #06b6d4; --acc1l: #a78bfa; --acc2l: #22d3ee;
  }
  body.theme-blue { --acc1: #2563eb; --acc2: #0891b2; --acc1l: #60a5fa; --acc2l: #22d3ee; }
  body.theme-green { --acc1: #0d9488; --acc2: #65a30d; --acc1l: #2dd4bf; --acc2l: #a3e635; }
  body.light {
    --bg: #eef2f8;
    --panel: #ffffff;
    --glass: rgba(255, 255, 255, 0.80);
    --glass-hover: rgba(255, 255, 255, 0.97);
    --line: rgba(15, 23, 42, 0.09);
    --line-strong: rgba(15, 23, 42, 0.18);
    --t1: #0f172a;
    --t2: #46536a;
    --t3: #5f6b7d;
    --shadow: 0 10px 30px -14px rgba(15, 23, 42, 0.28);
  }
  * { -webkit-font-smoothing: antialiased; }
  html, body { background: var(--bg); }
  body { color: var(--t1); font-family: Inter, system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(680px 460px at 12% -6%, rgba(139, 92, 246, 0.20), transparent 62%),
      radial-gradient(720px 480px at 96% 2%, rgba(6, 182, 212, 0.16), transparent 60%),
      radial-gradient(560px 420px at 60% 108%, rgba(251, 146, 60, 0.10), transparent 62%);
  }
  body.light::before { opacity: .5; }

  /* ===== 校园微光：地标线稿水印 ===== */
  /* 压在内容之上的极淡线稿纹理：不遮挡阅读，但能透出校园感 */
  .campus-mark { position: fixed; left: 260px; right: 0; bottom: 0; z-index: 35; pointer-events: none; opacity: .07; mix-blend-mode: screen; }
  body.light .campus-mark { opacity: .12; mix-blend-mode: multiply; }
  .campus-mark svg { width: 100%; height: auto; display: block; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, .28); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, .5); }
  .scroll-slim { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .glass-card { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 1rem; transition: all .3s ease; position: relative; }
  .glass-card:hover { transform: translateY(-5px); background: var(--glass-hover); border-color: var(--line-strong); box-shadow: var(--shadow); }
  .btn-press:active { transform: scale(.95); }
  /* 全局点击反馈：点到哪儿，涟漪就在哪儿散开——任何一次点击都有回应 */
  .rip { position: fixed; width: 18px; height: 18px; border-radius: 50%; pointer-events: none; z-index: 300;
         margin: -9px 0 0 -9px; background: radial-gradient(circle, rgba(139,92,246,.55) 0%, rgba(139,92,246,.18) 45%, rgba(139,92,246,0) 72%);
         animation: rip .52s cubic-bezier(.22,.61,.36,1) forwards; }
  @keyframes rip { 0% { transform: scale(.25); opacity: .95; } 100% { transform: scale(3.2); opacity: 0; } }
  .rippleable { position: relative; }
  @media (prefers-reduced-motion: reduce) { .rip { animation-duration: .001s; } }
  .t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); }
  .txt-grad { background-image: linear-gradient(90deg, var(--acc1l) 0%, var(--acc2l) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bg-grad { background-image: linear-gradient(90deg, var(--acc1) 0%, var(--acc2) 100%); }
  .ring-grad { background-image: linear-gradient(135deg, var(--acc1), var(--acc2)); }

  /* ===== 便签与贴纸：打破网格的工业感 ===== */
  .note { transition: transform .3s cubic-bezier(.22,.9,.3,1), box-shadow .3s ease; }
  .note:hover { transform: translateY(-6px) rotate(0deg) !important; }
  .tilt-a { transform: rotate(-.5deg); }
  .tilt-b { transform: rotate(.6deg); }
  .tilt-c { transform: rotate(-.3deg); }
  .glass-card.tilt-a:hover, .glass-card.tilt-b:hover, .glass-card.tilt-c:hover { transform: translateY(-5px) rotate(0deg); }
  .sticker { position: absolute; z-index: 20; padding: 3px 10px; border-radius: 11px; font-size: 11.5px; font-weight: 700; white-space: nowrap; transform: rotate(7deg); box-shadow: 0 8px 18px -8px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.22); }
  .sticker-l { transform: rotate(-8deg); }
  .sticker-warm { background-image: linear-gradient(120deg, #fb923c, #f43f5e); color: #2b0f05; }
  .sticker-mint { background-image: linear-gradient(120deg, #34d399, #22d3ee); color: #04241f; }
  .sticker-pink { background-image: linear-gradient(120deg, #f472b6, #a78bfa); color: #2b0430; }
  .sticker-lemon { background-image: linear-gradient(120deg, #facc15, #fb923c); color: #2b1d02; }

  /* ===== 动效 ===== */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .anim-up { animation: fadeInUp .55s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
  .breath { animation: pulseDot 1.8s ease-in-out infinite; }
  @keyframes breatheGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }
  .glow-dot { animation: breatheGlow 2s infinite; }
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.04) 100%); background-size: 420px 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .rise { animation: riseIn .42s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .spin { animation: spinSlow 1s linear infinite; }
  @keyframes barGrow { from { width: 0; } }
  .bar-fill { animation: barGrow .9s cubic-bezier(.3,.9,.3,1) both; }

  /* 划掉的待办：整行淡下去，一眼看出这事儿已经了了 */
  .todo-done { opacity: .55; }
  .todo-done:hover { opacity: .8; }

  /* 逐字输出时的光标 */
  .caret { display: inline-block; width: 7px; height: 13px; margin-left: 2px; vertical-align: -2px; background: #22d3ee; opacity: .75; animation: blink .9s infinite; }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; opacity: .9; } }

  /* 正在输入：三个蹦跶的小圆点 */
  .typing i { display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: #22d3ee; margin-right: 3px; }
  .typing i:nth-child(1) { animation: jumpDot .9s infinite ease-in-out; }
  .typing i:nth-child(2) { animation: jumpDot .9s .15s infinite ease-in-out; }
  .typing i:nth-child(3) { animation: jumpDot .9s .3s infinite ease-in-out; margin-right: 0; }
  @keyframes jumpDot { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

  /* 学长的思考过程：一条时间线 */
  .think-box { border-left: 2px solid rgba(34,211,238,.42); padding-left: 12px; }
  .think-box ol { list-style: decimal; }
  .think-box ol li::marker { color: rgba(148,163,184,.8); }
  .loader { width: 14px; height: 14px; border-radius: 999px; border: 2px solid rgba(251,191,36,.25); border-top-color: #fbbf24; animation: spinSlow .75s linear infinite; }

  /* 倒计时脉冲 */
  .cd-pop { animation: popPulse .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes popPulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }

  /* 勾选待办的撒花 + 成就标 */
  .confetti-bit { position: fixed; width: 8px; height: 8px; border-radius: 2px; z-index: 131; pointer-events: none; animation: dropBit .95s cubic-bezier(.3,.7,.6,1) forwards; }
  @keyframes dropBit { 0% { transform: translate(0,0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
  .done-tag { position: fixed; z-index: 132; pointer-events: none; font-size: 12.5px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background-image: linear-gradient(90deg, #34d399, #22d3ee); color: #04241f; box-shadow: 0 10px 24px -8px rgba(52,211,153,.7); animation: doneTag 1.35s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes doneTag { 0% { opacity: 0; transform: translateY(8px) scale(.7); } 22% { opacity: 1; transform: translateY(-6px) scale(1.08); } 70% { opacity: 1; transform: translateY(-10px) scale(1); } 100% { opacity: 0; transform: translateY(-26px) scale(.95); } }

  /* 同学头像堆叠 */
  .avatar-stack { display: flex; align-items: center; }
  .avatar-stack > * { margin-left: -9px; border-radius: 999px; box-shadow: 0 0 0 2px var(--panel); }
  .avatar-stack > *:first-child { margin-left: 0; }

  .glow-warm { box-shadow: 0 0 0 1px rgba(251,146,60,.20), 0 18px 40px -26px rgba(251,146,60,.85); }
  .glow-mint { box-shadow: 0 0 0 1px rgba(52,211,153,.20), 0 18px 40px -26px rgba(52,211,153,.8); }
  .glow-pink { box-shadow: 0 0 0 1px rgba(244,114,182,.20), 0 18px 40px -26px rgba(244,114,182,.8); }
  .emoji-ico { font-size: 17px; line-height: 1; }

  .neon { color: #fde68a; text-shadow: 0 0 12px rgba(250, 204, 21, .85), 0 0 30px rgba(251, 146, 60, .5); letter-spacing: .04em; }
  body.light .neon { color: #b45309; text-shadow: 0 0 12px rgba(251, 191, 36, .6); }

  .nav-item { transition: all .25s ease; position: relative; }
  .nav-item:hover { background: rgba(255, 255, 255, .05); }
  body.light .nav-item:hover { background: rgba(15, 23, 42, .05); }
  .nav-item.active { background: rgba(255, 255, 255, .10); }
  body.light .nav-item.active { background: rgba(139, 92, 246, .12); }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 22px; border-radius: 0 6px 6px 0; background-image: linear-gradient(180deg, var(--acc1l), var(--acc2l)); box-shadow: 0 0 12px var(--acc1); }

  .chip { transition: all .22s ease; }
  .chip:hover { transform: translateY(-1px); }

  .md-strong { color: var(--t1); font-weight: 700; }
  .md-code { padding: 2px 6px; border-radius: 6px; background: rgba(139, 92, 246, .14); color: #67e8f9; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; border: 1px solid rgba(139, 92, 246, .22); }
  body.light .md-code { color: #0e7490; background: rgba(6, 182, 212, .12); }
  .md-mark { color: #fdba74; font-weight: 700; }
  .md-list li { position: relative; padding-left: 16px; }
  .md-list li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 99px; background-image: linear-gradient(135deg, #a78bfa, #22d3ee); }

  .msg-user { background-image: linear-gradient(90deg, var(--acc1), var(--acc2)); color: #fff; }
  .bubble-ai { background: var(--glass); border: 1px solid var(--line); }
  .tool-card { background: rgba(251, 146, 60, .07); border: 1px solid rgba(251, 146, 60, .22); }
  body.light .tool-card { background: rgba(251, 146, 60, .10); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; font-weight: 700; color: var(--t2); padding: 7px 10px; background: rgba(139, 92, 246, .10); white-space: nowrap; }
  .tbl td { padding: 7px 10px; border-top: 1px solid var(--line); color: var(--t1); white-space: nowrap; }
  .tbl tr:hover td { background: rgba(139, 92, 246, .06); }
  .tbl.wrap { table-layout: fixed; width: 100%; }
  .tbl.wrap th, .tbl.wrap td { white-space: normal; line-height: 1.55; }
  .tbl.wrap th:first-child, .tbl.wrap td:first-child { width: 26%; }

  .code-wrap { background: #06090f; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .code-body { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #a5f3fc; padding: 12px 14px; overflow-x: auto; white-space: pre; }

  #boot { position: fixed; inset: 0; z-index: 200; background: #0b1120; display: flex; align-items: center; justify-content: center; transition: opacity .5s ease, visibility .5s ease; }
  #boot.hide { opacity: 0; visibility: hidden; }
  @keyframes bootBar { from { width: 6%; } to { width: 100%; } }
  #bootBar { animation: bootBar 1.25s cubic-bezier(.3,.9,.3,1) forwards; }
  .kbd { border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; font-size: 10px; color: var(--t2); }
  .stat-card { height: 120px; }
  input, textarea, button { outline: none; }
  input::placeholder, textarea::placeholder { color: var(--t3); }
  .toast { position: fixed; right: 28px; bottom: 28px; z-index: 140; }

  /* ===== 侧边栏折叠：260px → 80px，只留图标 ===== */
  #sidebar, header, main, .campus-mark { transition: width .32s cubic-bezier(.22,.9,.3,1), left .32s cubic-bezier(.22,.9,.3,1), margin-left .32s cubic-bezier(.22,.9,.3,1); }

  body.collapsed header { left: 80px !important; }
  body.collapsed main { margin-left: 80px !important; }

  /* ===== 全局搜索：命中数提示条 ===== */
  #searchBar { position: fixed; top: 92px; left: 50%; transform: translateX(-50%) translateY(-14px); z-index: 130; opacity: 0; visibility: hidden; transition: all .28s ease;
    padding: 8px 14px; border-radius: 999px; font-size: 12px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); backdrop-filter: blur(16px); box-shadow: var(--shadow); }
  #searchBar.on { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  body.collapsed #searchBar { left: calc(50% + -90px); }

  /* ===== 关于我们 / 通用弹窗 ===== */
  #modal { position: fixed; inset: 0; z-index: 180; display: flex; align-items: center; justify-content: center; padding: 24px;

  #modal.open { opacity: 1; visibility: visible; }

    background: color-mix(in srgb, var(--panel) 97%, transparent); border: 1px solid var(--line); backdrop-filter: blur(20px); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8); }

  el.innerHTML = icon(ic, 'w-4 h-4 shrink-0 ' + color) + '<span>' + h(msg) + '</span>';

/* 点击涟漪：不管点到什么，落点先散开一圈——「这一下点到了」 */
function clickRipple(x, y) {
  if (!document.body || document.body.classList.contains('no-rip')) return;
  const el = document.createElement('span');
  el.className = 'rip';
  el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 580);
}

function cardHint(e) {
  const t = e.target;
  if (!t || !t.closest) return;
  if (e.target.closest('#modal, #drawer, #sidebar, #topbar, #toastWrap')) return;
  if (t.closest(NO_HINT)) return;
  const card = t.closest('[data-card]');
  if (!card) return;
  const name = card.getAttribute('data-card') || '这块';
  const now = Date.now();
  if (now - cardHintAt < 1600 && cardHintName === name) return;
  cardHintAt = now; cardHintName = name;
  toast('「' + name + '」是展示面板 · 里面的按钮都能点，也可以直接问学长', 'info');
}

  for (let i = 0; i < 18; i++) {
    const b = document.createElement('span');
    b.className = 'confetti-bit';
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.background = colors[i % colors.length];
    b.style.borderRadius = i % 3 === 0 ? '99px' : '2px';
    b.style.setProperty('--dx', rand(-90, 90) + 'px');
    b.style.setProperty('--dy', rand(-70, 110) + 'px');
    b.style.setProperty('--rot', rand(-220, 220) + 'deg');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1000);
  }
  const tag = document.createElement('div');
  tag.className = 'done-tag';
  tag.style.left = (x - 26) + 'px'; tag.style.top = (y - 34) + 'px';

  document.body.appendChild(tag);
  setTimeout(() => tag.remove(), 1400);
}

     不会一直贴着下限；撞到两头时只能往中间走，所以数字永远落在 6~12 里 */
  let up = Math.random() < 0.5;
  if (freeN <= 6) up = true;

  const pool = mockData.classrooms.filter((c) => (c.free !== true) === up);
  if (!pool.length) return null;
  const r = pool[Math.floor(Math.random() * pool.length)];
  r.free = up;

  r.until = pick(['17:00', '17:30', '18:00', '19:00', '20:00', '21:00', '22:00']);

/* 近 30 天流水：前 23 天按本周的形状做确定性扰动，最后 7 天**原样**就是 week，
   所以「近 7 天」永远是「近 30 天」的尾巴，切范围不会跟侧边栏打架 */
(function buildMonth() {
  let seed = 20261014;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const tail = mockData.week.map((d) => ({ orders: d.orders, notices: d.notices }));
  const days = [];
  const end = day0Safe();                    /* 本周周日 */
  for (let i = 29; i >= 0; i--) {
    const d = new Date(end.getTime()); d.setDate(d.getDate() - i);
    const label = (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2, '0');
    if (i < 7) {
      const t = tail[6 - i];
      days.push({ label: label, wd: WD[d.getDay()], orders: t.orders, notices: t.notices });
    } else {
      const k = (i - 7) % 7;
      const o = Math.max(2, Math.round(mockData.week[(k + 4) % 7].orders * (0.6 + rnd() * 0.85)));
      const n = Math.max(3, Math.round(mockData.week[(k + 3) % 7].notices * (0.55 + rnd() * 0.9)));
      days.push({ label: label, wd: WD[d.getDay()], orders: o, notices: n });
    }
  }
  mockData.month = days;
})();
function day0Safe() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const wd = (d.getDay() + 6) % 7;           /* 周一 = 0 */
  d.setDate(d.getDate() + (6 - wd));         /* 挪到本周周日（week 数组的最后一格） */
  return d;
}

/* 数据里只写发布日期（published），「今天 / 昨天 / 3 天前 / 10月8日」都是打开页面时算出来的。
   演示放几天再打开，也不会出现「明天发布的通知」这种穿帮。 */
function bjYMD(t) { /* 统一按北京时间取年月日，跟浏览器所在时区无关 */
  const d = new Date(t.getTime() + 8 * 3600e3);
  return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()];
}
function relDay(iso) {
  const t0 = new Date(iso.length <= 10 ? iso + 'T00:00:00+08:00' : iso);
  const a = bjYMD(t0), b = bjYMD(new Date());
  const days = Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return days + ' 天前';
  return a[1] + '月' + a[2] + '日';
}
/* 「10月17日 09:20」——快讯顶栏的同步时间用它 */
function stampLabel(iso) {
  const t = new Date(iso);

  const hh = String(new Date(t.getTime() + 8 * 3600e3).getUTCHours()).padStart(2, '0');
  const mm = String(new Date(t.getTime() + 8 * 3600e3).getUTCMinutes()).padStart(2, '0');
  return d[1] + '月' + d[2] + '日 ' + hh + ':' + mm;

/* ------------------------------ Markdown 轻量渲染 ------------------------------ */
function mdInline(s) {
  let o = h(s);
  o = o.replace(/\*\*(.+?)\*\*/g, '<span class="md-strong">$1</span>');
  o = o.replace(/==(.+?)==/g, '<span class="md-mark">$1</span>');
  o = o.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
  return o;
}
function mdBlock(text) {
  const lines = String(text || '').split('\n');
  let html = '', list = [];
  const flush = () => { if (list.length) { html += '<ul class="md-list space-y-1.5 text-[13px] t2 leading-relaxed my-1.5">' + list.join('') + '</ul>'; list = []; } };
  lines.forEach((line) => {
    const t = line.trim();
    if (!t) { flush(); return; }
    if (/^[-*]\s+/.test(t)) { list.push('<li>' + mdInline(t.replace(/^[-*]\s+/, '')) + '</li>'); return; }
    if (/^\d+\.\s+/.test(t)) { list.push('<li>' + mdInline(t) + '</li>'); return; }
    flush();
    html += '<p class="text-[13px] t1 leading-[1.8] mb-2 opacity-90">' + mdInline(t) + '</p>';
  });
  flush();
  return html;
}

function libCloseSub() {
  const now = new Date();
  const close = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 22, 0, 0, 0);
  const mins = Math.round((close - now) / 60000);
  if (mins <= 0) return '22:00 已闭馆，明早 8:00 再开';
  if (mins < 60) return '22:00 闭馆，还有 ' + mins + ' 分钟';
  return '22:00 闭馆，还有 ' + Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分';
}

/* 占用变了就地刷新：统计卡、楼层胶囊、列表三处一起动，数字永远来自同一份数据 */
function refreshRooms(manual) {
  const freeN = roomFree();
  const st = document.getElementById('stat-rooms');
  if (st) {
    st.textContent = freeN; st.setAttribute('data-count', freeN);
    st.classList.remove('cd-pop'); void st.offsetWidth; st.classList.add('cd-pop');
  }
  const note = document.getElementById('roomNote');
  if (note) note.textContent = freeN >= 10 ? '空的多，现在去还能挑窗边的座儿' : freeN >= 8 ? '还行，热门的几间手快点' : '紧俏！先去八号楼碰碰运气';
  const scope = document.querySelector('[data-roomscope]');
  if (scope) {
    const chips = scope.querySelector('[data-roomchips]');
    const list = scope.querySelector('[data-roomlist]');
    if (chips) chips.innerHTML = roomChipsHTML();
    if (list) list.innerHTML = mockData.classrooms.filter((c) => c.free).map(roomRowHTML).join('');
    applyRoomFilter(scope, state.roomFloor || 'all');
    const tick = document.getElementById('roomTick');
    if (tick) tick.textContent = (manual ? '刚刷过 ' : '') + hhmm();
  }
  return freeN;
}

  return { yi: pickAt(f.yi, 3), ji: pickAt(f.ji, 7), lucky: pickAt(f.lucky, 11), tip: pickAt(f.tip, 17), day: (d.getMonth() + 1) + '/' + d.getDate() };

/* 「立即同步」：配了接口就真去拉，没配 / 拉不到就老实说用的是本地快照 */
async function syncFeed() {
  const btns = document.querySelectorAll('[data-feedsync]');
  btns.forEach((b) => { b.disabled = true; b.style.opacity = '.6'; });
  const url = (typeof window !== 'undefined' && window.LIVE_FEED_URL) || '';
  try {
    if (!url) {
      await new Promise((r) => setTimeout(r, 550));
      toast('演示环境没接外网：本地快照 ' + mockData.feedMeta.syncedLabel + ' 已经是最新，' + state.feed.length + ' 条都在 📡', 'warn');
      return;
    }
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const arr = await r.json();
    if (!Array.isArray(arr) || !arr.length) throw new Error('格式不对');
    const seen = new Set(state.feed.map((x) => x.url + '|' + x.title));
    let add = 0;
    arr.forEach((x) => {
      if (!x || !x.title || seen.has((x.url || '') + '|' + x.title)) return;
      seen.add((x.url || '') + '|' + x.title);
      state.feed.push({ id: 'live' + Date.now() + (add++), kind: x.kind === 'bid' ? 'bid' : 'news', src: x.src || '校园快讯接口', published: x.published || new Date().toISOString().slice(0, 10), url: x.url || '#', title: x.title, digest: x.digest || '', time: relDay(x.published || new Date().toISOString().slice(0, 10)) });
    });
    state.feedAt = new Date().toISOString();
    mockData.feedMeta.syncedLabel = stampLabel(state.feedAt);
    renderView();
    toast(add ? ('同步完了，新进来 ' + add + ' 条 📡') : '同步完了，没有新消息，安心 ✨', 'ok');
  } catch (err) {
    toast('没连上接口（' + err.message + '），继续用本地快照', 'warn');
  } finally {
    btns.forEach((b) => { b.disabled = false; b.style.opacity = ''; });
  }
}

/* Canvas 星点：慢速飘，不抢内容，也不吃 CPU */
function startStars() {
  const cv = document.getElementById('stars'); if (!cv || !cv.getContext) return;
  const c2 = cv.getContext('2d');
  let w = 0, h = 0, dots = [];
  const fit = () => {
    w = cv.width = window.innerWidth; h = cv.height = window.innerHeight;
    const n = Math.min(90, Math.round(w * h / 22000));
    dots = [];
    for (let i = 0; i < n; i++) dots.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.6 + .5, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18, a: Math.random() * .5 + .2 });
  };
  fit();
  window.addEventListener('resize', fit);
  const draw = () => {
    const acc = ACC(), acc2 = ACC2();
    c2.clearRect(0, 0, w, h);
    dots.forEach((d, i) => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
      if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
      c2.beginPath(); c2.arc(d.x, d.y, d.r, 0, 6.2832);
      c2.fillStyle = (i % 3 === 0 ? acc2 : acc);
      c2.globalAlpha = d.a;
      c2.fill();
    });
    c2.globalAlpha = 1;
    /* 近处的点连一根线，有点「校园星空」的意思 */
    for (let i = 0; i < dots.length; i += 3) {
      for (let j = i + 1; j < Math.min(i + 4, dots.length); j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) { c2.globalAlpha = (1 - dist / 120) * .12; c2.strokeStyle = acc; c2.beginPath(); c2.moveTo(dots[i].x, dots[i].y); c2.lineTo(dots[j].x, dots[j].y); c2.stroke(); }
      }
    }
    c2.globalAlpha = 1;
    requestAnimationFrame(draw);
  };
  draw();
}

  const s = Math.floor(diff / 1000);

  const els = { 'cd-d': Math.floor(s / 86400), 'cd-h': Math.floor(s % 86400 / 3600), 'cd-m': Math.floor(s % 3600 / 60), 'cd-s': s % 60 };

 * 又让网络面板里看得到真实的取数请求。 */
const DB = {
  cache: {},
  embedded(name) {
    const map = {
      classrooms: () => mockData.classrooms,
      notices: () => mockData.notifications,
      feed: () => mockData.feed,
      courses: () => mockData.courses,
      canteen: () => mockData.canteen,

    };
    const f = map[name];
    if (!f) return null;
    const v = f();
    return JSON.parse(JSON.stringify(v));   // 工具改数组不污染页面数据
  },
  async get(name) {
    if (this.cache[name]) return this.cache[name];
    let v = null;
    if (/^https?:/.test(location.protocol)) {
      try {
        const r = await fetch('data/' + name + '.json', { cache: 'no-store' });
        if (r.ok) v = await r.json();
      } catch (e) { /* 没部署数据文件就走内嵌 */ }

    if (!v) v = this.embedded(name);
    this.cache[name] = v;

const KEY_LS = 'ccnu-agent-config';
const agentCfg = { provider: 'qwen', key: '' };
function loadAgentCfg() {
  try {
    const raw = localStorage.getItem(KEY_LS);
    if (raw) { const o = JSON.parse(raw); if (o && o.provider && LLM_PROVIDERS[o.provider]) { agentCfg.provider = o.provider; agentCfg.key = o.key || ''; } }
  } catch (e) {}
  if (!agentCfg.key && window.__LLM_KEY__) agentCfg.key = window.__LLM_KEY__;
}
function saveAgentCfg() { try { localStorage.setItem(KEY_LS, JSON.stringify(agentCfg)); } catch (e) {} }
function provider() { return LLM_PROVIDERS[agentCfg.provider] || LLM_PROVIDERS.qwen; }
function hasKey() { return !!(agentCfg.key && agentCfg.key.length > 12); }
function clearKey() { agentCfg.key = ''; saveAgentCfg(); toast('Key 已从本机清除', 'warn'); }

async function callLLM({ messages, tools, signal }) {
  if (window.__MOCK_LLM__) return window.__MOCK_LLM__({ messages, tools });   // 回归测试用
  if (!hasKey()) throw new Error('NO_KEY');
  const p = provider();
  const ctrl = new AbortController();
  const timer = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 30000);
  if (signal) signal.addEventListener('abort', () => { try { ctrl.abort(); } catch (e) {} });
  try {
    const r = await fetch(p.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + agentCfg.key },
      body: JSON.stringify({ model: p.model, messages, tools, tool_choice: 'auto', temperature: 0.5 }),
      signal: ctrl.signal
    });
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      throw new Error('LLM ' + r.status + ' ' + txt.slice(0, 160));
    }
    return await r.json();
  } finally { clearTimeout(timer); }
}

const pad2 = (n) => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function plusDay(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

tool({
  schema: {
    name: 'classroom_query',
    description: '查询空闲教室，按日期、时段、容量、是否有插座、楼栋筛选。用户问去哪自习、开会、写作业、找教室时用。',
    parameters: {
      type: 'object',
      properties: {
        date: { type: 'string', description: 'YYYY-MM-DD，默认今天' },
        slot: { type: 'string', description: '时段，如 13:00-18:00' },
        capacity: { type: 'integer', description: '最少容纳人数' },
        hasSocket: { type: 'boolean', description: '是否必须带插座' },
        building: { type: 'string', description: '楼栋，如「七号楼」' },
        limit: { type: 'integer', description: '最多返回几间，默认 4' }
      }
    }
  },
  source: 'GET /data/classrooms.json（HTTP 部署时）／内嵌快照',
  ui: { samples: ['明天下午找个能坐30人带插座的教室', '七号楼现在有空教室吗', '今晚哪里能自习到十点'], steps: ['把「明天下午 / 30 人 / 插座」变成参数', '按容量和插座过滤教室', '按人数最接近排序', '把房间、空到几点、楼栋交给模型组织成人话'] },

    list.sort((a, b) => (Number(b.socket) - Number(a.socket)) || (Math.abs(a.cap - base) - Math.abs(b.cap - base)));
    return {
      total: list.length,
      date: args.date || todayISO(),
      slot: args.slot || '现在起',
      rooms: list.slice(0, args.limit || 4).map((c) => ({ room: c.room, capacity: c.cap, socket: c.socket, until: c.until, building: c.building, kind: c.kind }))

  }
});

/* ------------------------------ 5. Agent 循环 ------------------------------ */
const MAX_STEPS = 6;
function safeParse(s) { try { return JSON.parse(s || '{}'); } catch (e) { return {}; } }

async function agentLoop(userText, opt) {
  const o = opt || {};
  const messages = [{ role: 'system', content: systemPrompt() }]
    .concat((o.history || []).slice(-12))
    .concat([{ role: 'user', content: userText }]);
  const trace = [];
  const t0 = Date.now();
  for (let step = 0; step < MAX_STEPS; step++) {
    const resp = await callLLM({ messages, tools: TOOL_SCHEMAS, signal: o.signal });
    const msg = resp && resp.choices && resp.choices[0] && resp.choices[0].message;
    if (!msg) throw new Error('模型返回为空');
    messages.push(msg);
    if (!msg.tool_calls || !msg.tool_calls.length) {
      return { answer: msg.content || '（我这边没组织好语言，你再说一次？）', trace, ms: Date.now() - t0 };
    }
    for (const tc of msg.tool_calls) {
      const name = tc.function && tc.function.name;
      const args = safeParse(tc.function && tc.function.arguments);
      const entry = { step, id: tc.id, name, args, status: 'running', at: Date.now() };
      trace.push(entry); if (o.onTrace) o.onTrace(entry);
      const block = SAFETY_GATE.check(name, args, userText);
      if (block) {
        entry.status = 'blocked'; entry.reason = block; entry.ms = Date.now() - entry.at;
        if (o.onTrace) o.onTrace(entry);
        messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify({ blocked: true, reason: block }) });
        continue;
      }
      const fn = TOOLS[name];
      if (!fn) {
        entry.status = 'error'; entry.reason = '没有这个工具'; entry.ms = Date.now() - entry.at;
        if (o.onTrace) o.onTrace(entry);
        messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify({ error: 'unknown_tool' }) });
        continue;
      }
      try {
        const result = await fn.execute(args);
        entry.status = 'done'; entry.result = result; entry.ms = Date.now() - entry.at;
        if (o.onTrace) o.onTrace(entry);
        messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify(result).slice(0, 6000) });
      } catch (e) {
        entry.status = 'error'; entry.reason = String(e && e.message || e); entry.ms = Date.now() - entry.at;
        if (o.onTrace) o.onTrace(entry);
        messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify({ error: entry.reason }) });
      }
    }
  }
  const last = trace[trace.length - 1];
  return { answer: '这一步我查得有点久（已经调了 ' + MAX_STEPS + ' 轮工具还没收敛）。先把最后拿到的结果给你：\n\n```json\n' + JSON.stringify(last && last.result || {}, null, 2).slice(0, 800) + '\n```\n\n要不要我换个问法再试？', trace, ms: Date.now() - t0 };
}

/* ------------------------------ 6. 记忆 ------------------------------ */
const AGENT_MEMORY = {
  buf: [],
  push(user, answer, trace) {
    this.buf.push({ role: 'user', content: user });
    (trace || []).forEach((e) => {
      if (e.status === 'done') {
        this.buf.push({ role: 'assistant', content: null, tool_calls: [{ id: e.id, type: 'function', function: { name: e.name, arguments: JSON.stringify(e.args) } }] });
        this.buf.push({ role: 'tool', tool_call_id: e.id, content: JSON.stringify(e.result).slice(0, 3000) });
      }
    });
    this.buf.push({ role: 'assistant', content: answer });
    if (this.buf.length > 24) this.buf = this.buf.slice(-24);
  },
  history() { return this.buf; },
  clear() { this.buf = []; }
};

/* ------------------------------ 7. 轨迹渲染 ------------------------------ */
function traceSummary(e) {
  if (e.status === 'blocked') return { cls: 'text-rose-400', txt: e.reason };
  if (e.status === 'error') return { cls: 'text-amber-400', txt: e.reason };
  if (e.status === 'running') return { cls: 'text-sky-300', txt: '调用中…' };
  const r = e.result || {};
  const hits = r.total !== undefined ? r.total : (r.notice ? 1 : (r.added ? 1 : (r.rooms ? r.rooms.length : '')));
  return { cls: 'text-emerald-400', txt: (hits !== '' ? '命中 ' + hits + ' 条' : '完成') + (e.ms ? ' · ' + e.ms + 'ms' : '') };
}
function traceRowHTML(e) {
  const dot = { running: '⏳', done: '✅', error: '❌', blocked: '🛑' }[e.status] || '·';
  const s = traceSummary(e);
  const args = JSON.stringify(e.args || {});
  return '<div class="flex items-center gap-2 text-[11px] leading-5">' +
    '<span class="shrink-0">' + dot + '</span>' +
    '<code class="font-mono text-[10.5px] t1 shrink-0">' + h(e.name) + '</code>' +
    '<span class="font-mono text-[10px] t3 truncate">' + h(args.length > 46 ? args.slice(0, 46) + '…' : args) + '</span>' +
    '<span class="ml-auto shrink-0 text-[10px] ' + s.cls + '">' + h(s.txt) + '</span></div>';
}
function traceHTML(trace) {
  if (!trace || !trace.length) return '';
  return '<div class="mt-2.5 pt-2.5" style="border-top:1px dashed var(--line)">' +
    '<div class="text-[10px] t3 font-mono mb-1.5">学长的执行轨迹 · ' + trace.length + ' 次工具调用</div>' +
    '<div class="space-y-0.5">' + trace.map(traceRowHTML).join('') + '</div></div>';
}

function createTraceBubble(bubbleEl) {
  const list = bubbleEl.querySelector('[data-trace]');
  const t0 = performance.now();
  const rows = {};
  return {
    onTrace(e) {
      if (!rows[e.id]) {
        const d = document.createElement('div');
        d.className = 'rise';
        list.appendChild(d);
        rows[e.id] = d;
      }
      rows[e.id].innerHTML = traceRowHTML(e);
      list.scrollTop = list.scrollHeight;
    },
    finish(trace) {
      if (!trace || !trace.length) return;
      const head = document.createElement('div');
      head.className = 'text-[10px] t3 font-mono mb-1';
      head.textContent = '调了 ' + trace.length + ' 次工具 · 用时 ' + ((performance.now() - t0) / 1000).toFixed(1) + 's';
      list.prepend(head);
    }
  };
}

    canteen: async () => { const r = await TOOLS.canteen_query.execute({}); const c = r.canteens[0]; return { name: 'canteen_query', result: r, answer: '这会儿 **' + c.name + '** 最空（' + c.crowd + '），冲鸭 🍚' }; },
    notice: async () => { const r = await TOOLS.notice_search.execute({ limit: 3 }); return { name: 'notice_search', result: r, answer: '最近有 **' + r.total + '** 条通知，前几条是：', table: { head: ['通知', '单位', '日期'], rows: r.notices.map((n) => [n.title, n.src, n.date]) } }; },
    schedule: async () => { const r = await TOOLS.schedule_read.execute({ day: 'today' }); return { name: 'schedule_read', result: r, answer: '今天有 **' + r.total + '** 节课。', table: { head: ['时间', '课程', '地点'], rows: r.courses.map((c) => [c.start + '-' + c.end, c.name, c.room]) } }; },
    todo: async () => { const r = await TOOLS.todo_read.execute({ status: 'pending' }); return { name: 'todo_read', result: r, answer: '还有 **' + r.total + '** 件没干：', table: { head: ['待办', '截止', '优先级'], rows: r.todos.map((t) => [t.title, t.due, t.priority]) } }; },
    clock: async () => { const r = await TOOLS.clock_read.execute({}); return { name: 'clock_read', result: r, answer: '现在是 **' + r.time + '**（' + r.date + ' ' + r.weekday + '）。' }; }
  };
  const run = await map[hit.say]();
  const trace = [{ step: 0, id: 'offline-' + hit.say, name: run.name, args: hit.args, status: 'done', result: run.result, ms: 0 }];
  return { answer: '⚠️ **离线直连**（关键词匹配，没有模型参与理解）\n\n' + run.answer, table: run.table, trace };
}

async function runAgent(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (state.busy) { toast('学长还在忙上一条呢，稍等我一下 🏃', 'warn'); return; }
  if (state.view !== 'dashboard') { state.view = 'dashboard'; renderView(); }
  state.busy = true;
  pushUser(text);
  const w = chatWrap();
  if (!w) { state.busy = false; return; }

  const holder = document.createElement('div');
  holder.className = 'flex gap-3 rise';
  holder.innerHTML = agentAvatar() +
    '<div class="min-w-0 flex-1 max-w-[88%]"><div class="bubble-ai px-4 py-3.5 rounded-2xl rounded-tl-sm">' +
      '<div class="text-[10.5px] t3 font-mono mb-2">学长的执行轨迹</div>' +
      '<div data-trace="1" class="space-y-1"></div>' +
      '<div data-answer="1" class="mt-1"></div>' +
    '</div></div>';

    icons(); scrollChat();
  } catch (e) {
    const msg = String(e && e.message || e);
    const hint = /NO_KEY/.test(msg) ? '还没填 Key。点下面的按钮接一个，或者先问我「现在哪有空教室」走离线直连。'
      : /Failed to fetch|NetworkError|CORS/i.test(msg) ? '浏览器把请求拦下了（多半是网络或服务商的 CORS 限制）。换个服务商，或用仓库里的 dev-server.js 起本地代理。'
      : /401|403/.test(msg) ? 'Key 被拒了（401/403）。检查 Key 有没有复制完整、额度是不是用完了。'
      : '模型那边出错了：' + msg.slice(0, 120);

      '<div class="mt-3"><button data-openkey="1" class="btn-press px-3.5 py-2 rounded-xl text-[11.5px] text-white bg-grad font-semibold">接上模型</button></div>');
    state.chat.push({ role: 'assistant', time: hhmm(), answer: hint, trace: [] });
  } finally {
    state.busy = false;
  }
}

/* 逐字吐答案：只在标签外面切，绝不把 <div> 切成两半；吐完再把下面的卡片淡入 */
function streamHTML(el, html) {
  const safe = [];
  let inTag = false;
  for (let i = 0; i < html.length; i++) {
    const ch = html.charAt(i);
    if (ch === '<') inTag = true;
    else if (ch === '>') inTag = false;
    if (!inTag) safe.push(i + 1);
  }
  const total = safe.length;
  if (!total) { el.innerHTML = html; return Promise.resolve(); }
  const step = Math.max(1, Math.round(total / 80));   /* 大约 80 帧吐完，长答案快一点、短答案慢一点 */
  let k = 0;
  return new Promise((resolve) => {
    const timer = setInterval(() => {
      k = Math.min(total, k + step);
      el.innerHTML = html.slice(0, safe[k - 1] || 0) + '<span class="caret"></span>';
      const l = document.getElementById('msgList');
      if (l && k % (step * 6) < step) l.scrollTop = l.scrollHeight;
      if (k >= total) { clearInterval(timer); el.innerHTML = html; resolve(); }
    }, 16);
  });
}

    dragId = null;
    renderView();
    toast('顺序调好了，排在前面的先干 💪', 'ok');
  });
  document.addEventListener('dragend', () => {
    dragId = null;
    document.querySelectorAll('.drag-row').forEach((x) => x.classList.remove('dragging', 'drop-hint'));
  });
}

function buildTranscript() {

    lines.push('## AI学长' + (m.time ? '（' + m.time + '）' : ''));
    lines.push('');
    if (m.plan) { lines.push('**学长的思路**'); m.plan.forEach((p, i) => lines.push((i + 1) + '. ' + p)); lines.push(''); }
    (m.tools || []).forEach((t) => lines.push('> 用了「' + (t.label || t.name) + '」' + (t.warn ? ' · 被学长拦下了' : ' · 搞定')));
    if (m.tools && m.tools.length) lines.push('');
    if (m.answer) { lines.push(m.answer); lines.push(''); }
    (m.more || []).forEach((sec) => { if (sec && sec.table) { lines.push('**' + sec.title + '**'); lines.push(''); lines.push('| ' + sec.table.head.join(' | ') + ' |'); lines.push('| ' + sec.table.head.map(() => '---').join(' | ') + ' |'); sec.table.rows.forEach((r) => lines.push('| ' + r.join(' | ') + ' |')); lines.push(''); } });
    if (m.table) { lines.push('| ' + m.table.head.join(' | ') + ' |'); lines.push('| ' + m.table.head.map(() => '---').join(' | ') + ' |'); m.table.rows.forEach((r) => lines.push('| ' + r.join(' | ') + ' |')); lines.push(''); }
    if (m.code) { lines.push('```' + m.code.lang); lines.push(m.code.body); lines.push('```'); lines.push(''); }
    if (m.tail) { lines.push(m.tail); lines.push(''); }
  });
  return lines.join('\n');
}

    if (d.floorbtn !== undefined) { filterRooms(t, d.floorbtn); return; }
  });
  /* ★ 待办勾选：用 change 事件（不是 click），勾上就划线变灰 + 数字减 1 + 完成率图表 setOption */
  document.addEventListener('change', (e) => {
    const cb = (e.target && e.target.closest) ? e.target.closest('.todo-check[data-todo]') : null;
    if (!cb) return;
    const id = cb.getAttribute('data-todo');
    const it = state.todos.find((x) => String(x.id) === String(id));
    if (!it) return;
    const done = !!cb.checked;
    it.status = done ? 'done' : 'pending';
    paintTodoRow(id, done);
    syncTodoUI();
    if (done) {
      const r = cb.getBoundingClientRect();
      celebrate(r.left + 8, r.top + 6, pick(['✅ 搞定！', '🎉 太强了', '💪 又干掉一个', '✨ 完成！']));
      toast('「' + it.title + '」搞定啦，剩下的交给明天', 'ok');
    } else {
      toast('「' + it.title + '」又放回待办里了（别拖鸭）', 'warn');
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const s = $('#globalSearch'); s && s.focus(); return; }
    if (e.key === 'Escape') {
      closeDrawer(); closeModal(); setDemo(false); clearSearch();
      const s = $('#globalSearch'); s && s.blur(); const i = $('#chatInput'); i && i.blur();
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'chatInput') { e.preventDefault(); submitChat(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'globalSearch') { e.preventDefault(); const v = e.target.value.trim(); clearSearch(); if (v) runAgent(v); }
    if (e.key === 'Enter' && e.target && e.target.id === 'newTodo') { e.preventDefault(); addTodo(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); setCollapsed(!state.collapsed); return; }
  });
  const gs = $('#globalSearch');
  if (gs) gs.addEventListener('input', (e) => filterCards(e.target.value));
  $('#demoBtn').addEventListener('click', () => setDemo(true));
  $('#collapseBtn').addEventListener('click', () => setCollapsed(!state.collapsed));
  $('#themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('light');
    const light = document.body.classList.contains('light');
    $('#themeBtn').innerHTML = icon(light ? 'moon' : 'sun', 'w-[18px] h-[18px] t2');
    try { localStorage.setItem('ccnu-theme', light ? 'light' : 'dark'); } catch (e) {}
    toast(light ? '白天模式，看书不刺眼 ☀️' : '晚上模式，护眼 🌙');
    renderView();
  });
  $('#bellBtn').addEventListener('click', () => {
    const open = toggleBellPop();
    if (open) toast(state.unread ? ('未读 ' + state.unread + ' 条，重点我都标好了 👉') : '没有未读啦，随便看看也行');
  });
  window.addEventListener('resize', () => { state.charts.forEach((c) => { try { c.resize(); } catch (e) {} }); });
}
function submitChat() {
  const i = $('#chatInput'); if (!i) return;
  const v = i.value.trim(); if (!v) return;
  i.value = ''; runAgent(v);
}
/* addTodo 已上移：新版会按关键词挑 emoji，并且加完自动滑出详情抽屉 */
function bindDelegatedButtons() {
  document.addEventListener('click', (e) => {
    if (e.target.closest('#sendBtn')) submitChat();
    if (e.target.closest('#addTodo')) addTodo();
    if (e.target.closest('#readAll')) { readAllNotifs(); }
    if (e.target.closest('[data-nreadall]')) { readAllNotifs(); }
    if (e.target.closest('[data-bellclose]')) { toggleBellPop(false); }
  });
}

/* ------------------------------ 依赖自检（断网降级提示） ------------------------------ */
function degradedCheck() {
  const probe = document.createElement('div');
  probe.className = 'grid';
  probe.style.cssText = 'position:absolute;left:-9999px;top:0';
  document.body.appendChild(probe);
  const twOk = getComputedStyle(probe).display === 'grid';
  probe.remove();
  const miss = [];
  if (!twOk) miss.push('Tailwind CSS（页面样式）');
  if (!window.lucide) miss.push('Lucide（图标）');
  if (!window.echarts) miss.push('ECharts（图表，已降级成内置 SVG 折线）');
  if (!miss.length) return;
  const el = document.createElement('div');
  el.className = 'glass-card px-4 py-3 text-[11.5px] t1 max-w-[560px]';
  el.style.cssText = 'position:fixed;left:280px;bottom:20px;z-index:150;border-color:rgba(245,158,11,.45);background:rgba(120,53,15,.35)';
  el.innerHTML = '<div class="flex items-start gap-2">' + icon('alert-triangle', 'w-4 h-4 text-amber-300 shrink-0 mt-[1px]') +
    '<div><div class="font-semibold mb-1">有几个外部资源没加载上（当前网络不通）</div>' +
    '<div class="t2 leading-relaxed">缺的是：' + h(miss.join('、')) + '。<br/>联网后刷新一下就好；也可以直接把 <b class="t1">vendor/</b> 文件夹和本文件放同一层，就能完全离线演示。</div></div></div>';
  document.body.appendChild(el); icons();
}

/* ------------------------------ 启动 ------------------------------ */
function boot() {
  loadAgentCfg();
  const logs = [
    '[ok] 学长起床了 · 洗漱完毕',
    '[ok] 技能树点亮 ' + mockData.tools.length + ' 项 · 扒通知 / 抢教室 / 干饭雷达 …',
    '[ok] 摸清你的课表与日程 ' + (state.todos.length) + ' 条',
    '[ok] 攒了 ' + state.notifs.length + ' 条通知，重点已经划好',
    '[ok] 记住了一条底线：涉及隐私和不可撤回的操作，先说清楚再不动手',
    '[ready] 华大万事通 · AI学长，随时听你喊'
  ];
  const box = $('#bootLog');
  logs.forEach((l, i) => setTimeout(() => { if (box) box.innerHTML += '<div class="' + (i === logs.length - 1 ? 'text-orange-300' : '') + '">' + h(l) + '</div>'; }, i * 170));
  setTimeout(() => {
    try {
      if (localStorage.getItem('ccnu-theme') === 'light') { document.body.classList.add('light'); $('#themeBtn').innerHTML = icon('moon', 'w-[18px] h-[18px] t2'); }
      const ac = localStorage.getItem('ccnu-accent'); if (ac && ac !== 'purple') setThemeColor(ac, true);
      if (localStorage.getItem('ccnu-collapsed') === '1') setCollapsed(true, true);
    } catch (e) {}
    $('#boot').classList.add('hide');
    setTimeout(() => { const b = $('#boot'); b && b.remove(); }, 600);
    state.booted = true;
  }, 1600);

  icons();
  startStars();
  renderSidebar();
  renderHeader();
  bindEvents();
  bindTodoUX();
  bindDelegatedButtons();
  renderView();
  syncNotifUI();   /* 未读数字在侧栏 / 铃铛 / 概览三处必须同源，启动时也对一次 */
  tickCountdown();
  setInterval(tickCountdown, 1000);
  /* 教室占用心跳：每 8 秒模拟一次「下课 / 上课」，统计卡与筛选表一起动 */
  setInterval(() => { if (tickRooms()) refreshRooms(); }, 8000);
  let vi = 0;
  setInterval(() => { const el = $('#vibeLine'); if (el) { vi = (vi + 1) % mockData.vibes.length; el.textContent = mockData.vibes[vi]; } }, 4200);
  setInterval(() => { const el = $('#footClock'); if (el) el.textContent = '本地时间 ' + hhmm() + ' · 学长在浏览器里跑，不联网也能用'; }, 20000);
  setTimeout(() => toast('学长上线啦～今天想让我帮你干点啥？'), 2200);
  setTimeout(degradedCheck, 1200);
}
boot();
</script>
</body>
